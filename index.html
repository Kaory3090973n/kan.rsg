    const STORAGE_KEY = 'studyflow_kan_singlefile_v1';
    const THEME_KEY = 'studyflow_kan_theme';

    function CircularProgress({ percentage, size = 14 }) {
      const sw = 2.2;
      const r = (size - sw) / 2;
      const c = r * 2 * Math.PI;
      const offset = c - (Math.min(100, Math.max(0, percentage)) / 100) * c;
      return (
        <svg width={size} height={size} className="-rotate-90 transform shrink-0">
          <circle cx={size / 2} cy={size / 2} r={r} fill="transparent" stroke="currentColor" strokeWidth={sw} className="text-light-500 dark:text-dark-500" />
          <circle cx={size / 2} cy={size / 2} r={r} fill="transparent" stroke="currentColor" strokeWidth={sw} strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" className={percentage === 100 ? 'text-emerald-500' : 'text-indigo-500'} />
        </svg>
      );
    }

    function App() {
      const [state, setState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : INITIAL_STATE;
        } catch { return INITIAL_STATE; }
      });

      const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');
      const [route, setRoute] = useState('boards'); // boards | templates | resources | settings | board-detail
      const [activeBoardId, setActiveBoardId] = useState(null);
      const [selectedCardId, setSelectedCardId] = useState(null);
      const [collapsed, setCollapsed] = useState(false);
      const [cmdOpen, setCmdOpen] = useState(false);
      const [shortcutsOpen, setShortcutsOpen] = useState(false);
      const [createBoardOpen, setCreateBoardOpen] = useState(false);
      const lastKeyRef = useRef({ key: '', time: 0 });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      useEffect(() => {
        localStorage.setItem(THEME_KEY, theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }, [theme]);

      // Atalhos de teclado (Ctrl+K, G->B/T/R/S, C, ?)
      useEffect(() => {
        const handler = (e) => {
          const tag = e.target.tagName;
          const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCmdOpen((v) => !v);
            return;
          }
          if (e.key === 'Escape') {
            setCmdOpen(false);
            setShortcutsOpen(false);
            setCreateBoardOpen(false);
            setSelectedCardId(null);
            return;
          }
          if (isInput) return;
          const k = e.key.toLowerCase();
          const now = Date.now();
          if (e.key === '?') {
            setShortcutsOpen((v) => !v);
            return;
          }
          if (k === 'c' && !e.ctrlKey && !e.metaKey) {
            setCreateBoardOpen(true);
            return;
          }
          if (lastKeyRef.current.key === 'g' && now - lastKeyRef.current.time < 900) {
            if (k === 'b') setRoute('boards');
            if (k === 't') setRoute('templates');
            if (k === 'r') setRoute('resources');
            if (k === 's') setRoute('settings');
            lastKeyRef.current = { key: '', time: 0 };
            return;
          }
          lastKeyRef.current = { key: k, time: now };
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, []);

      const activeWorkspace = state.workspaces.find((w) => w.id === state.activeWorkspaceId) || state.workspaces[0];
      const workspaceBoards = state.boards.filter((b) => b.workspaceId === activeWorkspace.id);
      const activeBoard = state.boards.find((b) => b.id === activeBoardId) || null;
      const totalHours = useMemo(
        () => workspaceBoards.filter((b) => !b.archived).reduce((acc, b) => acc + b.cards.reduce((s, c) => s + (Number(c.studyHours) || 0), 0), 0),
        [workspaceBoards]
      );

      const updateBoard = (boardId, updater) => {
        setState((prev) => ({
          ...prev,
          boards: prev.boards.map((b) => (b.id === boardId ? updater(b) : b)),
        }));
      };

      const createBoard = ({ name, description, category, repoLink, lists, labels }) => {
        const newBoard = {
          id: uid('board'),
          workspaceId: activeWorkspace.id,
          name,
          description,
          category: category || 'estudos',
          repoLink: repoLink || '',
          favorite: false,
          archived: false,
          lists: (lists || ['Para Estudar', 'Em Andamento', 'Revisão', 'Concluído']).map((ln) => ({ id: uid('list'), name: ln })),
          labels: (labels || [
            { id: uid('lbl'), name: 'Teoria', colourCode: '#0ea5e9' },
            { id: uid('lbl'), name: 'Prática', colourCode: '#10b981' },
            { id: uid('lbl'), name: 'Urgente', colourCode: '#ef4444' },
          ]).map((l) => ({ ...l, id: uid('lbl') })),
          cards: [],
        };
        setState((prev) => ({ ...prev, boards: [newBoard, ...prev.boards] }));
        setActiveBoardId(newBoard.id);
        setRoute('board-detail');
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-light-100 text-light-1000 dark:bg-dark-50 dark:text-dark-1000">
          {/* SIDEBAR */}
          <SideNav
            workspaces={state.workspaces}
            activeWorkspace={activeWorkspace}
            onSwitchWorkspace={(id) => {
              setState((p) => ({ ...p, activeWorkspaceId: id }));

            }}
            onCreateWorkspace={(name, description) => {
              const ws = { id: uid('ws'), name, description };
              setState((p) => ({ ...p, workspaces: [...p.workspaces, ws], activeWorkspaceId: ws.id }));
            }}
            route={route}
            onNavigate={(r) => setRoute(r)}
            onOpenCmd={() => setCmdOpen(true)}
            onOpenShortcuts={() => setShortcutsOpen(true)}
            theme={theme}
            onToggleTheme={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
            collapsed={collapsed}
            onToggleCollapse={() => setCollapsed((c) => !c)}
            profileName={state.profile.name}
            githubHandle={state.profile.githubHandle}
            totalHours={totalHours}
          />

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex flex-1 flex-col overflow-hidden">
            {route === 'boards' && (
              <BoardsView
                workspace={activeWorkspace}
                boards={workspaceBoards}
                onOpenBoard={(id) => { setActiveBoardId(id); setRoute('board-detail'); }}
                onToggleFav={(id) => updateBoard(id, (b) => ({ ...b, favorite: !b.favorite }))}
                onToggleArchive={(id) => updateBoard(id, (b) => ({ ...b, archived: !b.archived }))}
                onDeleteBoard={(id) => setState((p) => ({ ...p, boards: p.boards.filter((b) => b.id !== id) }))}
                onOpenCreate={() => setCreateBoardOpen(true)}
              />
            )}

            {route === 'board-detail' && activeBoard && (
              <BoardDetailView
                board={activeBoard}
                onBack={() => setRoute('boards')}
                onUpdateBoard={(updater) => updateBoard(activeBoard.id, updater)}
                onSelectCard={(cardId) => setSelectedCardId(cardId)}
              />
            )}

            {route === 'templates' && (
              <TemplatesView
                onUseTemplate={(tpl) =>
                  createBoard({
                    name: tpl.name,
                    description: tpl.description,
                    category: tpl.category,
                    lists: tpl.lists,
                    labels: tpl.labels,
                  })
                }
              />
            )}

            {route === 'resources' && (
              <ResourcesView
                resources={state.resources.filter((r) => r.workspaceId === activeWorkspace.id)}
                onAdd={(res) => setState((p) => ({ ...p, resources: [{ ...res, id: uid('res'), workspaceId: activeWorkspace.id, completed: false }, ...p.resources] }))}
                onToggle={(id) => setState((p) => ({ ...p, resources: p.resources.map((r) => (r.id === id ? { ...r, completed: !r.completed } : r)) }))}
                onDelete={(id) => setState((p) => ({ ...p, resources: p.resources.filter((r) => r.id !== id) }))}
              />
            )}

            {route === 'settings' && (
              <SettingsView
                state={state}
                onUpdateProfile={(profile) => setState((p) => ({ ...p, profile }))}
                onImportState={(imported) => setState(imported)}
                onReset={() => {
                  if (confirm('Restaurar dados iniciais de exemplo?')) {
                    setState(INITIAL_STATE);
                  }
                }}
              />
            )}
          </main>

          {/* MODAL DO CARD */}
          {activeBoard && selectedCardId && (() => {
            const card = activeBoard.cards.find((c) => c.id === selectedCardId);
            if (!card) return null;
            return (
              <CardModal
                board={activeBoard}
                card={card}
                onClose={() => setSelectedCardId(null)}
                onUpdateCard={(updated) =>
                  updateBoard(activeBoard.id, (b) => ({
                    ...b,
                    cards: b.cards.map((c) => (c.id === updated.id ? updated : c)),
                  }))
                }
                onDeleteCard={(cid) =>
                  updateBoard(activeBoard.id, (b) => ({
                    ...b,
                    cards: b.cards.filter((c) => c.id !== cid),
                  }))
                }
                onCreateLabel={(name, colourCode) => {
                  const id = uid('lbl');
                  updateBoard(activeBoard.id, (b) => ({
                    ...b,
                    labels: [...b.labels, { id, name, colourCode }],
                  }));
                  return id;
                }}
              />
            );
          })()}

          {/* MODAL NOVO QUADRO */}
          {createBoardOpen && (
            <CreateBoardModal
              onClose={() => setCreateBoardOpen(false)}
              onCreate={(data) => {
                createBoard(data);
                setCreateBoardOpen(false);
              }}
            />
          )}

          {/* COMMAND PALETTE */}
          {cmdOpen && (
            <CommandPalette
              boards={state.boards}
              onClose={() => setCmdOpen(false)}
              onOpenBoard={(id) => { setActiveBoardId(id); setRoute('board-detail'); }}
              onOpenCard={(bid, cid) => { setActiveBoardId(bid); setRoute('board-detail'); setSelectedCardId(cid); }}
              onNavigate={(r) => setRoute(r)}
            />
          )}

          {/* ATALHOS */}
          {shortcutsOpen && <ShortcutsModal onClose={() => setShortcutsOpen(false)} />}
        </div>
      );
    }

    // --- SIDEBAR COMPONENT ---
    function SideNav({ workspaces, activeWorkspace, onSwitchWorkspace, onCreateWorkspace, route, onNavigate, onOpenCmd, onOpenShortcuts, theme, onToggleTheme, collapsed, onToggleCollapse, profileName, githubHandle, totalHours }) {

      const [creatingWs, setCreatingWs] = useState(false);
      const [wsName, setWsName] = useState('');

        { id: 'boards', label: 'Quadros', shortcut: 'G B', icon: 'kanban' },
        { id: 'templates', label: 'Templates', shortcut: 'G T', icon: 'template' },
        { id: 'resources', label: 'Roteiros & Links', shortcut: 'G R', icon: 'book' },
        { id: 'settings', label: 'Configurações', shortcut: 'G S', icon: 'settings' },

      return (
        <aside className={`flex h-screen shrink-0 flex-col justify-between border-r border-light-400 bg-light-50 p-3 transition-all dark:border-dark-300 dark:bg-dark-100 ${collapsed ? 'w-[62px]' : 'w-[248px]'}`}>
          <div>
            <div className="relative mb-3">
              <div className={`flex items-center gap-1.5 ${collapsed ? 'flex-col' : 'justify-between'}`}>
                <button
                  onClick={() => setWsOpen(!wsOpen)}
                  className={`flex h-[34px] min-w-0 flex-1 items-center rounded-md p-1.5 text-left hover:bg-light-200 dark:hover:bg-dark-200 ${collapsed ? 'w-9 flex-none justify-center p-0' : ''}`}
                >
                  <span className="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-indigo-700 text-xs font-bold text-white">
                    {activeWorkspace.name.charAt(0).toUpperCase()}

                  {!collapsed && (
                    <>
                      <span className="ml-2 flex-1 truncate text-sm font-bold">{activeWorkspace.name}</span>
                      <Icon name="chevronDown" className="ml-1 h-3.5 w-3.5 shrink-0 text-light-800 dark:text-dark-800" />
                    </>
                  )}
                </button>
                <button
                  onClick={onOpenCmd}
                  title="Buscar (Ctrl+K)"
                  className="flex h-[34px] w-[34px] shrink-0 items-center justify-center rounded-lg bg-light-200 text-light-900 hover:bg-light-300 dark:bg-dark-200 dark:text-dark-950 dark:hover:bg-dark-300"
                >
                  <Icon name="search" />
                </button>
              </div>

              {wsOpen && (
                <div className="absolute left-0 top-11 z-40 w-60 rounded-lg border border-light-500 bg-light-50 p-1.5 shadow-3xl-light dark:border-dark-500 dark:bg-dark-200 dark:shadow-3xl-dark">
                  <div className="px-2 py-1 text-[11px] font-semibold uppercase tracking-wider text-light-800 dark:text-dark-800">Espaços Pessoais</div>
                  {workspaces.map((ws) => (
                    <button

                      onClick={() => { onSwitchWorkspace(ws.id); setWsOpen(false); }}

                    >
                      <span className="truncate">{ws.name}</span>
                      {ws.id === activeWorkspace.id && <Icon name="check" className="h-3.5 w-3.5 text-indigo-500" />}
                    </button>
                  ))}
                  <div className="my-1 border-t border-light-400 dark:border-dark-400" />
                  {!creatingWs ? (
                    <button onClick={() => setCreatingWs(true)} className="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-xs font-medium text-indigo-600 hover:bg-light-200 dark:text-indigo-400 dark:hover:bg-dark-300">
                      <Icon name="plus" className="h-3.5 w-3.5" /> Novo espaço
                    </button>
                  ) : (
                    <form

                        e.preventDefault();
                        if (!wsName.trim()) return;
                        onCreateWorkspace(wsName.trim(), '');

                        setCreatingWs(false);
                        setWsOpen(false);
                      }}
                      className="space-y-1.5 p-1.5"
                    >
                      <input autoFocus value={wsName} onChange={(e) => setWsName(e.target.value)} placeholder="Nome do espaço..." className="w-full rounded border border-light-500 bg-white px-2 py-1 text-xs dark:border-dark-500 dark:bg-dark-100" />
                      <button type="submit" className="w-full rounded bg-indigo-700 py-1 text-xs font-semibold text-white">Criar</button>
                    </form>
                  )}
                </div>
              )}
            </div>

            <nav className="space-y-1">
              {navs.map((item) => {
                const active = route === item.id || (item.id === 'boards' && route === 'board-detail');
                return (
                  <button
                    key={item.id}
                    onClick={() => onNavigate(item.id)}
                    className={`group flex w-full items-center justify-between rounded-md px-2.5 py-2 text-sm font-medium transition-colors ${
                      active
                        ? 'bg-light-200 text-light-1000 dark:bg-dark-200 dark:text-dark-1000'
                        : 'text-light-900 hover:bg-light-200/70 hover:text-light-1000 dark:text-dark-900 dark:hover:bg-dark-200/70 dark:hover:text-dark-1000'
                    } ${collapsed ? 'justify-center px-0' : ''}`}

                    <div className="flex items-center gap-2.5">
                      <Icon name={item.icon} />

                    {!collapsed && <span className="text-[10px] text-light-700 opacity-0 group-hover:opacity-100 dark:text-dark-700">{item.shortcut}</span>}
                  </button>
                );
              })}

            {!collapsed && (
              <div className="mt-6 rounded-lg border border-dashed border-light-400 bg-light-100/70 p-3 dark:border-dark-400 dark:bg-dark-50/70">

                  <span>Horas planejadas</span>
                  <span className="font-bold text-indigo-600 dark:text-indigo-400">{totalHours}h</span>
                </div>
                {githubHandle && (
                  <a href={`https://github.com/${githubHandle}`} target="_blank" rel="noreferrer" className="mt-2 flex items-center gap-1.5 truncate text-xs text-light-900 hover:text-light-1000 dark:text-dark-900 dark:hover:text-dark-1000">
                    <Icon name="github" className="h-3.5 w-3.5 shrink-0" />
                    <span className="truncate">github.com/{githubHandle}</span>
                  </a>
                )}

            )}

          <div className="space-y-1 border-t border-light-400 pt-3 dark:border-dark-300">
            <div className={`flex items-center ${collapsed ? 'flex-col gap-1.5' : 'justify-between px-1'}`}>
              <button onClick={onToggleTheme} className="flex items-center gap-2 rounded-md p-1.5 text-xs text-light-900 hover:bg-light-200 dark:text-dark-900 dark:hover:bg-dark-200">
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className={theme === 'dark' ? 'h-4 w-4 text-amber-400' : 'h-4 w-4 text-indigo-600'} />
                {!collapsed && <span>{theme === 'dark' ? 'Modo Claro' : 'Modo Escuro'}</span>}
              </button>
              <div className="flex items-center gap-1">
                <button onClick={onOpenShortcuts} title="Atalhos (?)" className="rounded-md p-1.5 text-light-900 hover:bg-light-200 dark:text-dark-900 dark:hover:bg-dark-200">
                  <Icon name="keyboard" />
                </button>
                <button onClick={onToggleCollapse} title="Recolher" className="rounded-md p-1.5 text-light-900 hover:bg-light-200 dark:text-dark-900 dark:hover:bg-dark-200">
                  <Icon name="panelLeft" />
                </button>
              </div>
            </div>

            <button onClick={() => onNavigate('settings')} className={`flex w-full items-center gap-2.5 rounded-md p-1.5 text-left hover:bg-light-200 dark:hover:bg-dark-200 ${collapsed ? 'justify-center' : ''}`}>
              <span className="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-light-400 text-xs font-bold dark:bg-dark-400">
                {profileName.charAt(0).toUpperCase()}
              </span>
              {!collapsed && <span className="truncate text-sm text-light-950 dark:text-dark-950">{profileName}</span>}
            </button>
          </div>
        </aside>
      );
    }

    // --- BOARDS VIEW ---
    function BoardsView({ workspace, boards, onOpenBoard, onToggleFav, onToggleArchive, onDeleteBoard, onOpenCreate }) {
      const [tab, setTab] = useState('active'); // active | archived
      const [search, setSearch] = useState('');

      const filtered = boards.filter((b) => {
        const matchTab = tab === 'archived' ? b.archived : !b.archived;
        const matchSearch = !search.trim() || b.name.toLowerCase().includes(search.toLowerCase());
        return matchTab && matchSearch;
      });

      const favorites = filtered.filter((b) => b.favorite);
      const others = filtered.filter((b) => !b.favorite);

      const renderCard = (b) => {
        const doneList = b.lists[b.lists.length - 1];
        const doneCount = doneList ? b.cards.filter((c) => c.listId === doneList.id).length : 0;
        const pct = b.cards.length > 0 ? Math.round((doneCount / b.cards.length) * 100) : 0;

        return (
          <div
            key={b.id}
            onClick={() => onOpenBoard(b.id)}
            className="group relative flex cursor-pointer flex-col justify-between rounded-lg border border-light-400 bg-light-50 p-4 transition-all hover:border-indigo-500/60 dark:border-dark-300 dark:bg-dark-100 dark:hover:border-indigo-500/60"
          >
            <div>
              <div className="mb-2 flex items-start justify-between gap-2">
                <span className="rounded bg-light-200 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-light-900 dark:bg-dark-200 dark:text-dark-900">
                  {b.category}
                </span>
                <div className="flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
                  <button
                    onClick={() => onToggleFav(b.id)}
                    title="Favoritar"
                    className={`rounded p-1 hover:bg-light-200 dark:hover:bg-dark-200 ${b.favorite ? 'text-amber-400' : 'text-light-700 dark:text-dark-700'}`}
                  >
                    <Icon name="star" className="h-3.5 w-3.5" />
                  </button>
                  <button
                    onClick={() => onToggleArchive(b.id)}
                    title={b.archived ? 'Desarquivar' : 'Arquivar'}
                    className="rounded p-1 text-light-700 hover:bg-light-200 dark:text-dark-700 dark:hover:bg-dark-200"
                  >
                    <Icon name="archive" className="h-3.5 w-3.5" />
                  </button>
                  <button
                    onClick={() => { if (confirm('Excluir este quadro?')) onDeleteBoard(b.id); }}
                    title="Excluir"
                    className="rounded p-1 text-light-700 hover:bg-red-500/10 hover:text-red-500 dark:text-dark-700"
                  >
                    <Icon name="trash" className="h-3.5 w-3.5" />
                  </button>
                </div>
              </div>

              <h3 className="text-base font-bold text-light-1000 group-hover:text-indigo-500 dark:text-dark-1000">{b.name}</h3>
              {b.description && <p className="mt-1 line-clamp-2 text-xs text-light-800 dark:text-dark-800">{b.description}</p>}
            </div>

            <div className="mt-4 flex items-center justify-between border-t border-light-300 pt-3 text-xs text-light-800 dark:border-dark-300 dark:text-dark-800">
              <span>{b.cards.length} cards · {b.lists.length} colunas</span>
              <div className="flex items-center gap-1.5">
                <CircularProgress percentage={pct} size={14} />
                <span className="font-semibold">{pct}%</span>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex-1 overflow-y-auto p-6 md:p-8 patterned-bg">
          <div className="mx-auto max-w-6xl">
            <div className="mb-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-xl font-bold">{workspace.name}</h1>
                <p className="text-xs text-light-800 dark:text-dark-800">{workspace.description}</p>
              </div>
              <button
                onClick={onOpenCreate}
                className="inline-flex items-center gap-2 rounded-lg bg-indigo-700 px-3.5 py-2 text-xs font-semibold text-white hover:bg-indigo-600"
              >
                <Icon name="plus" className="h-4 w-4" /> Novo Quadro <kbd className="ml-1 rounded bg-indigo-800 px-1 text-[10px]">C</kbd>
              </button>
            </div>

            <div className="mb-6 flex flex-wrap items-center justify-between gap-3">
              <div className="inline-flex rounded-lg border border-light-400 bg-light-50 p-0.5 dark:border-dark-300 dark:bg-dark-100">
                <button
                  onClick={() => setTab('active')}
                  className={`rounded-md px-3 py-1.5 text-xs font-semibold ${tab === 'active' ? 'bg-light-200 text-light-1000 dark:bg-dark-200 dark:text-dark-1000' : 'text-light-800 dark:text-dark-800'}`}
                >
                  Ativos ({boards.filter((b) => !b.archived).length})
                </button>
                <button
                  onClick={() => setTab('archived')}
                  className={`rounded-md px-3 py-1.5 text-xs font-semibold ${tab === 'archived' ? 'bg-light-200 text-light-1000 dark:bg-dark-200 dark:text-dark-1000' : 'text-light-800 dark:text-dark-800'}`}
                >
                  Arquivados ({boards.filter((b) => b.archived).length})
                </button>
              </div>

              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Filtrar quadros..."
                className="w-60 rounded-lg border border-light-400 bg-light-50 px-3 py-1.5 text-xs focus:border-indigo-500 focus:outline-none dark:border-dark-300 dark:bg-dark-100"
              />
            </div>

            {favorites.length > 0 && (
              <div className="mb-8">
                <h2 className="mb-3 text-xs font-bold uppercase tracking-wider text-light-800 dark:text-dark-800">Favoritos</h2>
                <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">{favorites.map(renderCard)}</div>
              </div>
            )}

            <div>
              <h2 className="mb-3 text-xs font-bold uppercase tracking-wider text-light-800 dark:text-dark-800">
                {tab === 'archived' ? 'Quadros Arquivados' : 'Todos os Quadros'}
              </h2>
              {others.length === 0 && favorites.length === 0 ? (
                <div className="rounded-xl border border-dashed border-light-400 bg-light-50/70 p-12 text-center dark:border-dark-400 dark:bg-dark-100/70">
                  <p className="text-sm font-medium text-light-800 dark:text-dark-800">Nenhum quadro encontrado neste espaço.</p>
                  <button onClick={onOpenCreate} className="mt-3 rounded-lg bg-indigo-700 px-3.5 py-2 text-xs font-semibold text-white hover:bg-indigo-600">
                    Criar primeiro quadro
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">{others.map(renderCard)}</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- BOARD DETAIL (KANBAN + CALENDÁRIO) ---
    function BoardDetailView({ board, onBack, onUpdateBoard, onSelectCard }) {
      const [viewMode, setViewMode] = useState('kanban'); // kanban | calendar
      const [filterLabelId, setFilterLabelId] = useState('');
      const [addingCardListId, setAddingCardListId] = useState(null);
      const [newCardTitle, setNewCardTitle] = useState('');
      const [addingList, setAddingList] = useState(false);
      const [newListName, setNewListName] = useState('');
      const [draggedCardId, setDraggedCardId] = useState(null);

      const visibleCards = useMemo(() => {
        if (!filterLabelId) return board.cards;
        return board.cards.filter((c) => c.labelIds.includes(filterLabelId));
      }, [board.cards, filterLabelId]);

      const handleCreateCard = (e, listId) => {
        e.preventDefault();
        if (!newCardTitle.trim()) return;
        const prefix = board.category === 'projeto' ? 'PRJ' : 'EST';
        const nextNum = String(board.cards.length + 1).padStart(2, '0');
        const newCard = {
          id: uid('card'),
          code: `${prefix}-${nextNum}`,
          title: newCardTitle.trim(),
          description: '',
          listId,
          labelIds: [],
          dueDate: null,
          checklists: [],
          activities: [{ id: uid('act'), text: 'Card criado.', createdAt: new Date().toISOString() }],
        };
        onUpdateBoard((b) => ({ ...b, cards: [...b.cards, newCard] }));
        setNewCardTitle('');
        setAddingCardListId(null);
      };

      const handleDropOnList = (targetListId) => {
        if (!draggedCardId) return;
        onUpdateBoard((b) => ({
          ...b,
          cards: b.cards.map((c) => (c.id === draggedCardId ? { ...c, listId: targetListId } : c)),
        }));
        setDraggedCardId(null);
      };

      const handleAddList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        onUpdateBoard((b) => ({
          ...b,
          lists: [...b.lists, { id: uid('list'), name: newListName.trim() }],
        }));
        setNewListName('');
        setAddingList(false);
      };

      return (
        <div className="flex flex-1 flex-col overflow-hidden">
          {/* Header do Quadro */}
          <header className="flex flex-wrap items-center justify-between gap-3 border-b border-light-400 bg-light-50 px-5 py-3 dark:border-dark-300 dark:bg-dark-100">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="rounded-md border border-light-400 px-2.5 py-1 text-xs font-medium hover:bg-light-200 dark:border-dark-400 dark:hover:bg-dark-200">
                ← Quadros
              </button>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-bold">{board.name}</h1>
                  {board.repoLink && (
                    <a href={board.repoLink} target="_blank" rel="noreferrer" className="text-light-800 hover:text-indigo-500 dark:text-dark-800" title="Abrir repositório">
                      <Icon name="github" className="h-4 w-4" />
                    </a>
                  )}
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {/* Filtro por Etiqueta */}
              <select
                value={filterLabelId}
                onChange={(e) => setFilterLabelId(e.target.value)}
                className="rounded-lg border border-light-400 bg-light-100 px-2.5 py-1.5 text-xs focus:outline-none dark:border-dark-400 dark:bg-dark-200"
              >
                <option value="">Todas as etiquetas</option>
                {board.labels.map((l) => (
                  <option key={l.id} value={l.id}>{l.name}</option>
                ))}
              </select>

              {/* Toggle Kanban / Calendário */}
              <div className="inline-flex rounded-lg border border-light-400 bg-light-100 p-0.5 dark:border-dark-400 dark:bg-dark-200">
                <button
                  onClick={() => setViewMode('kanban')}
                  className={`flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-semibold ${viewMode === 'kanban' ? 'bg-white text-light-1000 shadow-sm dark:bg-dark-400 dark:text-dark-1000' : 'text-light-800 dark:text-dark-800'}`}
                >
                  <Icon name="kanban" className="h-3.5 w-3.5" /> Kanban
                </button>

    function CalendarBoardView({ cards, onSelectCard, onMoveDate }) {
      const [cursor, setCursor] = useState(() => new Date());
      const [dragId, setDragId] = useState(null);

      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const monthName = cursor.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

      return (
        <div className="flex flex-1 flex-col overflow-y-auto p-5 patterned-bg">
          <div className="mb-4 flex items-center justify-between">
            <h2 className="text-base font-bold capitalize">{monthName}</h2>
            <div className="flex items-center gap-1.5">
              <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="rounded-lg border border-light-400 bg-light-50 p-1.5 dark:border-dark-400 dark:bg-dark-100">
                <Icon name="chevronLeft" />
              </button>
              <button onClick={() => setCursor(new Date())} className="rounded-lg border border-light-400 bg-light-50 px-3 py-1 text-xs font-semibold dark:border-dark-400 dark:bg-dark-100">
                Hoje
              </button>
              <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="rounded-lg border border-light-400 bg-light-50 p-1.5 dark:border-dark-400 dark:bg-dark-100">
                <Icon name="chevronRight" />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-px overflow-hidden rounded-xl border border-light-400 bg-light-400 dark:border-dark-300 dark:bg-dark-300">
            {['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((w) => (
              <div key={w} className="bg-light-100 py-2 text-center text-xs font-bold text-light-800 dark:bg-dark-100 dark:text-dark-800">
                {w}
              </div>
            ))}
            {cells.map((day, idx) => {
              const iso = day ? `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}` : null;
              const dayCards = iso ? cards.filter((c) => c.dueDate === iso) : [];
              return (
                <div
                  key={idx}
                  onDragOver={(e) => iso && e.preventDefault()}
                  onDrop={() => { if (iso && dragId) { onMoveDate(dragId, iso); setDragId(null); } }}
                  className="min-h-[105px] bg-light-50 p-2 dark:bg-dark-50"
                >
                  {day && (
                    <>
                      <div className="mb-1 text-xs font-semibold text-light-800 dark:text-dark-800">{day}</div>
                      <div className="space-y-1">
                        {dayCards.map((c) => (
                          <div
                            key={c.id}
                            draggable
                            onDragStart={() => setDragId(c.id)}
                            onClick={() => onSelectCard(c.id)}
                            className="cursor-pointer truncate rounded bg-indigo-600/15 px-1.5 py-1 text-[11px] font-medium text-indigo-600 hover:bg-indigo-600/25 dark:text-indigo-300"
                          >
                            {c.code} · {c.title}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- SETTINGS & BACKUP VIEW ---
    function SettingsView({ state, onUpdateProfile, onImportState, onReset }) {
      const [name, setName] = useState(state.profile.name);
      const [githubHandle, setGithubHandle] = useState(state.profile.githubHandle || '');

      const handleExport = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `studyflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed.workspaces && parsed.boards) {
              onImportState(parsed);
              alert('Backup restaurado com sucesso!');
            }
          } catch {
            alert('Arquivo JSON inválido.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="flex-1 overflow-y-auto p-6 md:p-8 patterned-bg">
          <div className="mx-auto max-w-2xl space-y-6">
            <div>
              <h1 className="text-xl font-bold">Configurações & Backup Local</h1>
              <p className="text-xs text-light-800 dark:text-dark-800">Todos os dados ficam salvos automaticamente no seu navegador (localStorage).</p>
            </div>

            <div className="space-y-4 rounded-xl border border-light-400 bg-light-50 p-5 dark:border-dark-300 dark:bg-dark-100">
              <h2 className="text-sm font-bold">Perfil Pessoal</h2>

                <label className="mb-1 block text-xs text-light-800 dark:text-dark-800">Nome de exibição</label>
                <input value={name} onChange={(e) => setName(e.target.value)} className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200" />
              </div>
              <div>
                <label className="mb-1 block text-xs text-light-800 dark:text-dark-800">Usuário do GitHub</label>
                <input value={githubHandle} onChange={(e) => setGithubHandle(e.target.value)} placeholder="seu-usuario" className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200" />
              </div>
              <button
                onClick={() => { onUpdateProfile({ ...state.profile, name, githubHandle }); alert('Perfil atualizado!'); }}
                className="rounded-lg bg-indigo-700 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-600"
              >
                Salvar perfil
              </button>
            </div>

            <div className="space-y-3 rounded-xl border border-light-400 bg-light-50 p-5 dark:border-dark-300 dark:bg-dark-100">
              <h2 className="text-sm font-bold">Portabilidade & GitHub</h2>
              <p className="text-xs text-light-800 dark:text-dark-800">
                Como você vai hospedar no GitHub, use o backup JSON para transferir seus quadros entre navegadores ou computadores diferentes.
              </p>
              <div className="flex flex-wrap gap-2.5 pt-1">
                <button onClick={handleExport} className="inline-flex items-center gap-2 rounded-lg bg-indigo-700 px-3.5 py-2 text-xs font-semibold text-white hover:bg-indigo-600">
                  <Icon name="download" className="h-4 w-4" /> Exportar JSON
                </button>
                <label className="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-light-500 bg-white px-3.5 py-2 text-xs font-semibold hover:bg-light-200 dark:border-dark-500 dark:bg-dark-200 dark:hover:bg-dark-300">
                  <Icon name="upload" className="h-4 w-4" /> Importar JSON
                  <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                </label>
                <button onClick={onReset} className="rounded-lg border border-red-500/40 px-3.5 py-2 text-xs font-semibold text-red-500 hover:bg-red-500/10">

                </button>
              </div>
            </div>
          </div>
        </div>
      );

            <div className="grid flex-1 grid-cols-1 overflow-y-auto md:grid-cols-3">
              <div className="space-y-5 border-b border-light-400 p-6 md:col-span-2 md:border-b-0 md:border-r dark:border-dark-300">
                <input
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  onBlur={() => saveBasics()}
                  className="w-full bg-transparent text-lg font-bold focus:outline-none"
                />

                <div>
                  <label className="mb-1.5 block text-xs font-semibold text-light-800 dark:text-dark-800">Anotações & Resumo</label>
                  <textarea
                    rows={4}
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    onBlur={() => saveBasics()}
                    placeholder="Escreva conceitos, comandos ou critérios..."
                    className="w-full rounded-lg border border-light-400 bg-white p-3 text-sm focus:border-indigo-500 focus:outline-none dark:border-dark-400 dark:bg-dark-200"
                  />
                </div>

                {/* Checklists */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold uppercase tracking-wider text-light-800 dark:text-dark-800">Checklists</span>
                    <button onClick={() => setAddingCl(true)} className="rounded-md border border-light-500 px-2.5 py-1 text-xs font-medium hover:bg-light-200 dark:border-dark-500 dark:hover:bg-dark-300">
                      + Nova checklist
                    </button>
                  </div>

                  {addingCl && (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!newClName.trim()) return;
                        onUpdateCard({ ...card, checklists: [...card.checklists, { id: uid('chk'), name: newClName.trim(), items: [] }] });
                        setNewClName('');
                        setAddingCl(false);
                      }}
                      className="flex gap-2"
                    >
                      <input autoFocus value={newClName} onChange={(e) => setNewClName(e.target.value)} placeholder="Nome da checklist..." className="flex-1 rounded border border-light-400 bg-white px-2.5 py-1.5 text-xs dark:border-dark-400 dark:bg-dark-200" />
                      <button type="submit" className="rounded bg-indigo-700 px-3 py-1 text-xs font-semibold text-white">Criar</button>
                    </form>
                  )}

                  {card.checklists.map((cl) => {
                    const done = cl.items.filter((i) => i.completed).length;
                    const pct = cl.items.length > 0 ? Math.round((done / cl.items.length) * 100) : 0;
                    return (
                      <div key={cl.id} className="rounded-lg border border-light-400 bg-light-100/60 p-3.5 dark:border-dark-400 dark:bg-dark-200/50">
                        <div className="mb-2 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <CircularProgress percentage={pct} size={15} />
                            <span className="text-sm font-bold">{cl.name}</span>
                            <span className="text-xs text-light-800 dark:text-dark-800">{done}/{cl.items.length}</span>
                          </div>
                          <button onClick={() => onUpdateCard({ ...card, checklists: card.checklists.filter((x) => x.id !== cl.id) })} className="text-xs text-light-800 hover:text-red-500 dark:text-dark-800">
                            Remover
                          </button>
                        </div>

                        <div className="space-y-1.5">
                          {cl.items.map((it) => (
                            <label key={it.id} className="flex cursor-pointer items-center gap-2 rounded px-1.5 py-1 hover:bg-light-200 dark:hover:bg-dark-300">
                              <input
                                type="checkbox"
                                checked={it.completed}
                                onChange={() =>
                                  onUpdateCard({
                                    ...card,
                                    checklists: card.checklists.map((c) =>
                                      c.id === cl.id ? { ...c, items: c.items.map((x) => (x.id === it.id ? { ...x, completed: !x.completed } : x)) } : c
                                    ),
                                  })
                                }
                                className="h-4 w-4 rounded text-indigo-600"
                              />
                              <span className={`text-sm ${it.completed ? 'line-through opacity-60' : ''}`}>{it.title}</span>
                            </label>
                          ))}
                        </div>

                        <input
                          value={itemDrafts[cl.id] || ''}
                          onChange={(e) => setItemDrafts((p) => ({ ...p, [cl.id]: e.target.value }))}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              const txt = (itemDrafts[cl.id] || '').trim();
                              if (!txt) return;
                              onUpdateCard({
                                ...card,
                                checklists: card.checklists.map((c) => (c.id === cl.id ? { ...c, items: [...c.items, { id: uid('ci'), title: txt, completed: false }] } : c)),
                              });
                              setItemDrafts((p) => ({ ...p, [cl.id]: '' }));
                            }
                          }}
                          placeholder="+ Adicionar item e pressionar Enter..."
                          className="mt-2.5 w-full rounded border border-light-400 bg-white px-2.5 py-1.5 text-xs dark:border-dark-400 dark:bg-dark-100"
                        />
                      </div>
                    );
                  })}
                </div>

                {/* Diário */}
                <div className="space-y-2.5 border-t border-light-400 pt-4 dark:border-dark-300">
                  <span className="block text-xs font-bold uppercase tracking-wider text-light-800 dark:text-dark-800">Diário de Progresso</span>
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!comment.trim()) return;
                      onUpdateCard({ ...card, activities: [{ id: uid('act'), text: comment.trim(), createdAt: new Date().toISOString() }, ...card.activities] });
                      setComment('');
                    }}
                    className="flex gap-2"
                  >
                    <input value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Registrar nota de estudo ou commit..." className="flex-1 rounded-lg border border-light-400 bg-white px-3 py-2 text-xs dark:border-dark-400 dark:bg-dark-200" />
                    <button type="submit" className="rounded-lg bg-indigo-700 px-3.5 py-2 text-xs font-semibold text-white">Registrar</button>
                  </form>
                  <div className="space-y-1.5">
                    {card.activities.map((a) => (
                      <div key={a.id} className="rounded-lg border border-light-300 bg-light-100 px-3 py-2 text-xs dark:border-dark-300 dark:bg-dark-200">
                        <p>{a.text}</p>
                        <span className="text-[10px] text-light-800 dark:text-dark-800">{new Date(a.createdAt).toLocaleString('pt-BR')}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Sidebar do Card */}
              <div className="space-y-4 bg-light-100/50 p-5 dark:bg-dark-50/40">
                <div>
                  <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Coluna / Status</label>
                  <select value={card.listId} onChange={(e) => onUpdateCard({ ...card, listId: e.target.value })} className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-xs dark:border-dark-400 dark:bg-dark-200">
                    {board.lists.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>

                <div>
                  <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Data Alvo</label>
                  <input type="date" value={card.dueDate || ''} onChange={(e) => onUpdateCard({ ...card, dueDate: e.target.value || null })} className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-xs dark:border-dark-400 dark:bg-dark-200" />
                </div>

                <div>
                  <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Horas Estimadas</label>
                  <input type="number" step="0.5" min="0" value={studyHours} onChange={(e) => setStudyHours(e.target.value)} onBlur={() => saveBasics()} placeholder="Ex: 2.5" className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-xs dark:border-dark-400 dark:bg-dark-200" />
                </div>

                <div>
                  <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Link GitHub / Material</label>
                  <div className="flex gap-1.5">
                    <input value={repoUrl} onChange={(e) => setRepoUrl(e.target.value)} onBlur={() => saveBasics()} placeholder="https://github.com/..." className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-xs dark:border-dark-400 dark:bg-dark-200" />
                    {repoUrl && (
                      <a href={repoUrl} target="_blank" rel="noreferrer" className="flex items-center justify-center rounded-lg border border-light-400 bg-white px-2.5 dark:border-dark-400 dark:bg-dark-200">
                        <Icon name="external" className="h-3.5 w-3.5" />
                      </a>
                    )}
                  </div>
                </div>

                <div>
                  <div className="mb-2 flex items-center justify-between">
                    <label className="text-xs font-semibold text-light-800 dark:text-dark-800">Etiquetas</label>
                    <button onClick={() => setCreatingLbl(!creatingLbl)} className="text-xs font-medium text-indigo-600 dark:text-indigo-400">+ Criar</button>
                  </div>

                  {creatingLbl && (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!lblName.trim()) return;
                        const id = onCreateLabel(lblName.trim(), lblColor);
                        onUpdateCard({ ...card, labelIds: [...card.labelIds, id] });
                        setLblName('');
                        setCreatingLbl(false);
                      }}
                      className="mb-2.5 space-y-2 rounded-lg border border-light-400 bg-white p-2.5 dark:border-dark-400 dark:bg-dark-200"
                    >
                      <input autoFocus value={lblName} onChange={(e) => setLblName(e.target.value)} placeholder="Nome da etiqueta..." className="w-full rounded border border-light-400 bg-transparent px-2 py-1 text-xs dark:border-dark-400" />
                      <div className="flex flex-wrap gap-1.5">
                        {PRESET_COLORS.map((c) => (
                          <button key={c} type="button" onClick={() => setLblColor(c)} style={{ backgroundColor: c }} className={`h-4 w-4 rounded-full ${lblColor === c ? 'ring-2 ring-indigo-400' : ''}`} />
                        ))}
                      </div>
                      <button type="submit" className="w-full rounded bg-indigo-700 py-1 text-xs font-semibold text-white">Salvar</button>
                    </form>
                  )}

                  <div className="flex flex-wrap gap-1.5">
                    {board.labels.map((l) => {
                      const active = card.labelIds.includes(l.id);
                      return (
                        <button
                          key={l.id}
                          onClick={() =>
                            onUpdateCard({
                              ...card,
                              labelIds: active ? card.labelIds.filter((x) => x !== l.id) : [...card.labelIds, l.id],
                            })
                          }
                          className={`inline-flex items-center gap-1.5 rounded-md border px-2 py-1 text-xs font-medium ${
                            active ? 'border-indigo-500 bg-indigo-500/15' : 'border-light-400 bg-white opacity-70 dark:border-dark-400 dark:bg-dark-200'
                          }`}
                        >
                          <span className="h-2 w-2 rounded-full" style={{ backgroundColor: l.colourCode }} />
                          {l.name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- CREATE BOARD MODAL ---
    function CreateBoardModal({ onClose, onCreate }) {
      const [name, setName] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState('estudos');
      const [repoLink, setRepoLink] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-4 backdrop-blur-[2px]" onClick={onClose}>
          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!name.trim()) return;
              onCreate({ name: name.trim(), description: description.trim(), category, repoLink: repoLink.trim() });
            }}
            onClick={(e) => e.stopPropagation()}
            className="w-full max-w-md space-y-4 rounded-xl border border-light-500 bg-light-50 p-5 shadow-3xl-light dark:border-dark-500 dark:bg-dark-100 dark:shadow-3xl-dark"
          >
            <div className="flex items-center justify-between">
              <h2 className="text-base font-bold">Novo Quadro</h2>
              <button type="button" onClick={onClose} className="rounded p-1 text-light-800 hover:bg-light-200 dark:text-dark-800 dark:hover:bg-dark-300">
                <Icon name="x" />
              </button>
            </div>

            <div>
              <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Nome do Quadro</label>
              <input autoFocus required value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex: Cálculo II, API em Rust, TCC..." className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200" />
            </div>

            <div>
              <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Categoria</label>
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200">
                <option value="estudos">Estudos / Disciplina</option>
                <option value="projeto">Projeto / Código</option>
                <option value="pesquisa">Pesquisa / Artigo</option>
              </select>
            </div>

            <div>
              <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Descrição (opcional)</label>
              <input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Objetivo principal deste quadro..." className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200" />
            </div>

            <div>
              <label className="mb-1 block text-xs font-semibold text-light-800 dark:text-dark-800">Link do Repositório GitHub (opcional)</label>
              <input value={repoLink} onChange={(e) => setRepoLink(e.target.value)} placeholder="https://github.com/..." className="w-full rounded-lg border border-light-400 bg-white px-3 py-2 text-sm dark:border-dark-400 dark:bg-dark-200" />
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="rounded-lg px-3.5 py-2 text-xs font-medium text-light-800 hover:bg-light-200 dark:text-dark-800 dark:hover:bg-dark-300">Cancelar</button>
              <button type="submit" className="rounded-lg bg-indigo-700 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-600">Criar Quadro</button>
            </div>
          </form>
        </div>
      );
    }

    // --- COMMAND PALETTE ---
    function CommandPalette({ boards, onClose, onOpenBoard, onOpenCard, onNavigate }) {
      const [q, setQ] = useState('');
      const items = useMemo(() => {
        const term = q.trim().toLowerCase();
        const res = [];
        if (!term) {
          res.push(
            { id: 'n1', title: 'Ir para Quadros', sub: 'G → B', act: () => onNavigate('boards') },
            { id: 'n2', title: 'Ir para Templates', sub: 'G → T', act: () => onNavigate('templates') },
            { id: 'n3', title: 'Ir para Roteiros & Links', sub: 'G → R', act: () => onNavigate('resources') },
            { id: 'n4', title: 'Ir para Configurações & Backup', sub: 'G → S', act: () => onNavigate('settings') }
          );
        }
        boards.filter((b) => !b.archived).forEach((b) => {
          if (!term || b.name.toLowerCase().includes(term)) {
            res.push({ id: b.id, title: b.name, sub: `Quadro · ${b.cards.length} cards`, act: () => onOpenBoard(b.id) });
          }
          b.cards.forEach((c) => {
            if (term && (c.title.toLowerCase().includes(term) || c.code.toLowerCase().includes(term))) {
              res.push({ id: c.id, title: `${c.code} — ${c.title}`, sub: b.name, act: () => onOpenCard(b.id, c.id) });
            }
          });
        });
        return res.slice(0, 10);
      }, [q, boards]);

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center bg-black/50 p-4 pt-[18vh] backdrop-blur-[2px]" onClick={onClose}>
          <div className="w-full max-w-[540px] divide-y divide-light-400 overflow-hidden rounded-lg border border-light-600 bg-white/95 shadow-3xl-light dark:divide-white/10 dark:border-dark-600 dark:bg-dark-100/95 dark:shadow-3xl-dark" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center px-4">
              <Icon name="search" className="h-4 w-4 text-light-800 dark:text-dark-800" />
              <input
                autoFocus
                value={q}
                onChange={(e) => setQ(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter' && items[0]) { items[0].act(); onClose(); } }}
                placeholder="Buscar quadros, cards ou comandos..."
                className="h-12 w-full bg-transparent px-3 text-sm focus:outline-none"
              />
            </div>
            <div className="max-h-72 overflow-y-auto p-1.5">
              {items.map((it) => (
                <button
                  key={it.id}
                  onClick={() => { it.act(); onClose(); }}
                  className="flex w-full items-center justify-between rounded-md px-3 py-2 text-left text-sm hover:bg-light-200 dark:hover:bg-dark-200"
                >
                  <span className="truncate font-medium">{it.title}</span>
                  <span className="ml-2 shrink-0 text-xs text-light-800 dark:text-dark-800">{it.sub}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- SHORTCUTS MODAL ---
    function ShortcutsModal({ onClose }) {
      const list = [
        { k: 'Ctrl + K', d: 'Busca rápida (Command Palette)' },
        { k: 'C', d: 'Criar novo quadro' },
        { k: 'G → B', d: 'Ir para Quadros' },
        { k: 'G → T', d: 'Ir para Templates' },
        { k: 'G → R', d: 'Ir para Roteiros & Links' },
        { k: 'G → S', d: 'Ir para Configurações' },
        { k: 'Esc', d: 'Fechar modal' },
      ];
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-[2px]" onClick={onClose}>
          <div className="w-full max-w-sm rounded-xl border border-light-500 bg-light-50 p-5 shadow-3xl-light dark:border-dark-500 dark:bg-dark-100 dark:shadow-3xl-dark" onClick={(e) => e.stopPropagation()}>
            <div className="mb-3 flex items-center justify-between">
              <h2 className="text-sm font-bold">Atalhos de Teclado</h2>
              <button onClick={onClose}><Icon name="x" /></button>
            </div>
            <div className="space-y-2">
              {list.map((i) => (
                <div key={i.k} className="flex items-center justify-between text-xs">
                  <span className="text-light-900 dark:text-dark-900">{i.d}</span>
                  <kbd className="rounded border border-light-500 bg-light-200 px-1.5 py-0.5 font-mono font-semibold dark:border-dark-500 dark:bg-dark-300">{i.k}</kbd>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
