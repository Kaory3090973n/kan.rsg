<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Kanban</title>
<style>
:root{
  /* Kan Light Theme Palette */
  --light-50:#fcfcfc;
  --light-100:#f8f8f8;
  --light-200:#f3f3f3;
  --light-300:#ededed;
  --light-400:#e8e8e8;
  --light-500:#e2e2e2;
  --light-600:#dbdbdb;
  --light-700:#c7c7c7;
  --light-800:#8f8f8f;
  --light-900:#858585;
  --light-950:#6f6f6f;
  --light-1000:#171717;

  --bg:var(--light-100);
  --surface:var(--light-50);
  --lane:var(--light-300);
  --lane-border:var(--light-400);
  --card:var(--light-50);
  --card-hover:#ffffff;
  --card-border:var(--light-300);
  --ink:var(--light-1000);
  --ink-soft:var(--light-950);
  --mute:var(--light-800);
  --line:var(--light-500);
  --line-strong:var(--light-600);
  --accent:#171717;
  --accent-ink:#fcfcfc;
  --danger:#dc2626;
  --success:#16a34a;
  --pattern-dot:#d4d4d4;
  --shadow-modal:0 16px 48px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
  --shadow-pop:0 8px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --dark-50:#161616;
    --dark-100:#1c1c1c;
    --dark-200:#232323;
    --dark-300:#282828;
    --dark-400:#2e2e2e;
    --dark-500:#343434;
    --dark-600:#3e3e3e;
    --dark-700:#505050;
    --dark-800:#707070;
    --dark-900:#7e7e7e;
    --dark-950:#bbbbbb;
    --dark-1000:#ededed;

    --bg:var(--dark-50);
    --surface:var(--dark-100);
    --lane:var(--dark-100);
    --lane-border:var(--dark-300);
    --card:var(--dark-200);
    --card-hover:var(--dark-300);
    --card-border:var(--dark-300);
    --ink:var(--dark-1000);
    --ink-soft:var(--dark-950);
    --mute:var(--dark-800);
    --line:var(--dark-400);
    --line-strong:var(--dark-600);
    --accent:var(--dark-1000);
    --accent-ink:var(--dark-50);
    --danger:#ef4444;
    --success:#22c55e;
    --pattern-dot:#2c2c2c;
    --shadow-modal:0 20px 60px rgba(0,0,0,.6);
    --shadow-pop:0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --dark-50:#161616;
  --dark-100:#1c1c1c;
  --dark-200:#232323;
  --dark-300:#282828;
  --dark-400:#2e2e2e;
  --dark-500:#343434;
  --dark-600:#3e3e3e;
  --dark-700:#505050;
  --dark-800:#707070;
  --dark-900:#7e7e7e;
  --dark-950:#bbbbbb;
  --dark-1000:#ededed;

  --bg:var(--dark-50);
  --surface:var(--dark-100);
  --lane:var(--dark-100);
  --lane-border:var(--dark-300);
  --card:var(--dark-200);
  --card-hover:var(--dark-300);
  --card-border:var(--dark-300);
  --ink:var(--dark-1000);
  --ink-soft:var(--dark-950);
  --mute:var(--dark-800);
  --line:var(--dark-400);
  --line-strong:var(--dark-600);
  --accent:var(--dark-1000);
  --accent-ink:var(--dark-50);
  --danger:#ef4444;
  --success:#22c55e;
  --pattern-dot:#2c2c2c;
  --shadow-modal:0 20px 60px rgba(0,0,0,.6);
  --shadow-pop:0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--pattern-dot) 0.75px, transparent 0.75px);
  background-size:15px 15px;
  color:var(--ink);
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Scrollbars estilo Kan */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--mute)}

/* Top Header */
header{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px 24px;
  flex-wrap:wrap;
  z-index:10;
}
.board-title-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  margin-right:auto;
  min-width:0;
}
#board-title{
  font-size:1.15rem;
  font-weight:700;
  letter-spacing:-.02em;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  padding:3px 7px;
  min-width:120px;
  max-width:280px;
}
#board-title:hover,#board-title:focus{
  background:var(--surface);
  border-color:var(--line-strong);
  outline:none;
}
.prefix-pill{
  font-size:.72rem;
  font-weight:600;
  color:var(--mute);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:5px;
  padding:2px 6px;
  cursor:pointer;
  user-select:none;
}
.prefix-pill:hover{border-color:var(--line-strong);color:var(--ink)}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:6px;
  padding:5px 11px;
  font-size:.82rem;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
  transition:background .12s,border-color .12s,opacity .12s;
}
.btn:hover{background:var(--lane)}
.btn.primary{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}
.btn.primary:hover{opacity:.9}
.btn.ghost{
  background:transparent;
  border-color:transparent;
  color:var(--ink-soft);
}
.btn.ghost:hover{background:var(--lane);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:.78rem}
.btn.icon-btn{padding:5px 7px}

.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:9px;color:var(--mute);pointer-events:none}
#search{
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:6px;
  padding:5px 10px 5px 28px;
  width:190px;
  font-size:.82rem;
}
#search::placeholder{color:var(--mute)}

/* Filter & Trash badge */
.rel{position:relative;display:inline-flex}
.count-dot{
  position:absolute;
  top:-6px;
  right:-6px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--bg);
  pointer-events:none;
}

/* Popover / Dropdown */
.popover{
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  min-width:220px;
  max-height:360px;
  overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:8px;
  padding:5px;
  box-shadow:var(--shadow-pop);
  z-index:120;
  display:none;
}
.popover.left{right:auto;left:0}
.popover.open{display:block}
.pop-title{
  font-size:.72rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--mute);
  padding:6px 8px 4px;
}
.pop-item{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  background:transparent;
  border:none;
  border-radius:5px;
  padding:6px 8px;
  font-size:.82rem;
  color:var(--ink);
  text-align:left;
}
.pop-item:hover{background:var(--lane)}
.pop-item input[type="checkbox"]{margin:0;accent-color:var(--accent)}
.pop-sep{height:1px;background:var(--line);margin:4px 0}

/* Board & Lists (Kan style: w-[18rem], rounded-md, clean headers) */
main{
  flex:1;
  display:flex;
  gap:16px;
  padding:4px 24px 20px;
  overflow-x:auto;
  overflow-y:hidden;
  align-items:flex-start;
}
.lane{
  flex:0 0 288px;
  width:288px;
  max-height:100%;
  display:flex;
  flex-direction:column;
  background:var(--lane);
  border:1px solid var(--lane-border);
  border-radius:8px;
  padding:8px 6px 8px 8px;
}
.lane.dragging-lane{opacity:.45}
.lane.lane-drop-target{outline:2px solid var(--accent);outline-offset:1px}
.lane-head{
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px 2px 8px 6px;
  cursor:grab;
}
.lane-head:active{cursor:grabbing}
.lane-title{
  flex:1;
  font-size:.88rem;
  font-weight:600;
  color:var(--ink);
  background:transparent;
  border:1px solid transparent;
  border-radius:5px;
  padding:3px 6px;
  min-width:0;
}
.lane-title:hover,.lane-title:focus{
  border-color:var(--line-strong);
  background:var(--card);
  outline:none;
}
.lane-count{
  font-size:.74rem;
  font-weight:600;
  color:var(--mute);
  padding:0 4px;
}
.lane-icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  border:none;
  background:transparent;
  color:var(--mute);
  border-radius:5px;
}
.lane-icon-btn:hover{background:var(--line);color:var(--ink)}

.cards{
  flex:1;
  overflow-y:auto;
  padding:2px 4px 4px 0;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:36px;
}
.lane.over .cards{
  outline:1.5px dashed var(--mute);
  outline-offset:-2px;
  border-radius:6px;
}

/* Kan Card Style */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:6px;
  padding:9px 11px;
  cursor:pointer;
  word-break:break-word;
  transition:background .12s,border-color .12s;
  user-select:none;
}
.card:hover{
  background:var(--card-hover);
  border-color:var(--line-strong);
}
.card.dragging{opacity:.35}
.card-num{
  display:block;
  font-size:.73rem;
  font-weight:500;
  color:var(--mute);
  margin-bottom:3px;
}
.card-title{
  font-size:.86rem;
  font-weight:500;
  color:var(--ink);
  line-height:1.38;
}
.card-footer{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.card-labels{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
/* Kan Badge */
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:2px 8px;
  font-size:10.5px;
  font-weight:500;
  color:var(--ink-soft);
  border:1px solid var(--line-strong);
  background:transparent;
  line-height:1.3;
}
.badge-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  flex-shrink:0;
}
.card-meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  min-height:20px;
}
.card-meta-left{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--mute);
  font-size:11px;
}
.meta-item{
  display:inline-flex;
  align-items:center;
  gap:3px;
}
.meta-item.overdue{color:var(--danger);font-weight:600}
.meta-item.done-due{color:var(--success)}

/* Kan Checklist Circular Progress Pill */
.cl-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  padding:2px 7px;
  font-size:10.5px;
  font-weight:500;
  color:var(--ink-soft);
  margin-left:auto;
}
.cl-ring{transform:rotate(-90deg);display:block}
.cl-ring-bg{stroke:var(--line-strong);fill:none}
.cl-ring-fg{stroke:#3b82f6;fill:none;stroke-linecap:round;transition:stroke-dashoffset .25s}
.cl-ring-fg.complete{stroke:#22c55e}

.empty-lane{
  color:var(--mute);
  text-align:center;
  padding:14px 8px;
  font-size:.78rem;
}
.add-card-inline{
  margin-top:4px;
  margin-right:4px;
  display:flex;
  align-items:center;
  gap:6px;
  background:transparent;
  border:none;
  border-radius:5px;
  padding:6px 8px;
  color:var(--mute);
  font-size:.8rem;
  font-weight:500;
  text-align:left;
}
.add-card-inline:hover{background:var(--line);color:var(--ink)}

.new-lane-btn{
  flex:0 0 260px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px dashed var(--line-strong);
  background:transparent;
  border-radius:8px;
  padding:11px;
  color:var(--mute);
  font-size:.84rem;
  font-weight:600;
}
.new-lane-btn:hover{color:var(--ink);border-color:var(--ink);background:var(--surface)}

/* Context Menu */
.ctx-menu{
  position:fixed;
  min-width:190px;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:8px;
  padding:4px;
  box-shadow:var(--shadow-pop);
  z-index:300;
  display:none;
}
.ctx-menu.open{display:block}

/* Kan Card Detail Modal (2-column layout like Kan CardPage + CardRightPanel) */
dialog{
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
  padding:0;
  box-shadow:var(--shadow-modal);
  max-width:94vw;
}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
#card-dlg{
  width:min(940px,95vw);
  height:min(86vh,780px);
}
.modal-shell{
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}
.modal-topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  flex-shrink:0;
}
.breadcrumbs{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:.8rem;
  font-weight:600;
  color:var(--ink-soft);
}
.breadcrumbs span.muted{color:var(--mute)}
.modal-body{
  display:flex;
  flex:1;
  overflow:hidden;
}
.modal-main{
  flex:1;
  overflow-y:auto;
  padding:24px 32px 40px;
}
.modal-side{
  width:290px;
  flex-shrink:0;
  border-left:1px solid var(--line);
  background:var(--bg);
  padding:22px 20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.side-row{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.side-label{
  font-size:.76rem;
  font-weight:600;
  color:var(--mute);
}
.side-control{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 9px;
  font-size:.82rem;
  color:var(--ink);
  text-align:left;
}
.side-control:hover{border-color:var(--line-strong)}

#m-title{
  width:100%;
  font-size:1.25rem;
  font-weight:700;
  letter-spacing:-.015em;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  padding:4px 6px;
  margin-left:-6px;
  resize:none;
  line-height:1.35;
}
#m-title:hover,#m-title:focus{
  background:var(--bg);
  border-color:var(--line-strong);
  outline:none;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 0 8px;
}
.section-head h3{
  margin:0;
  font-size:.85rem;
  font-weight:600;
  color:var(--ink);
}
#m-desc{
  width:100%;
  min-height:92px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:7px;
  padding:10px 12px;
  font-size:.86rem;
  line-height:1.55;
  resize:vertical;
}
#m-desc:focus{border-color:var(--line-strong);outline:none}

/* Labels inside modal */
.side-labels{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.label-chip-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:3px 9px;
  font-size:11px;
  font-weight:500;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink);
}
.label-chip-btn:hover{background:var(--lane)}

/* Checklists inside modal (Kan style) */
.checklist-block{
  margin-top:16px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 14px;
  background:var(--bg);
}
.checklist-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.checklist-name{
  flex:1;
  font-size:.88rem;
  font-weight:600;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  padding:2px 5px;
  min-width:0;
}
.checklist-name:hover,.checklist-name:focus{
  background:var(--surface);
  border-color:var(--line-strong);
  outline:none;
}
.cl-items{display:flex;flex-direction:column;gap:2px}
.cl-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:5px 6px;
  border-radius:5px;
}
.cl-item:hover{background:var(--lane)}
.cl-item input[type="checkbox"]{
  width:15px;
  height:15px;
  border-radius:4px;
  accent-color:#2563eb;
  cursor:pointer;
  flex-shrink:0;
}
.cl-item-text{
  flex:1;
  background:transparent;
  border:none;
  font-size:.84rem;
  padding:1px 3px;
  min-width:0;
}
.cl-item-text.done{text-decoration:line-through;color:var(--mute)}
.cl-item-text:focus{outline:none;background:var(--surface);border-radius:3px}
.cl-item-del{
  opacity:0;
  border:none;
  background:transparent;
  color:var(--mute);
  padding:2px 5px;
  border-radius:4px;
}
.cl-item:hover .cl-item-del{opacity:1}
.cl-item-del:hover{color:var(--danger);background:var(--surface)}
.cl-add-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}
.cl-add-row input{
  flex:1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:5px;
  padding:5px 8px;
  font-size:.82rem;
}

/* Comments & Activity Feed (Kan style) */
.activity-divider{
  margin-top:26px;
  padding-top:20px;
  border-top:1px solid var(--line);
}
.comment-box{
  border:1px solid var(--line-strong);
  background:var(--bg);
  border-radius:9px;
  padding:10px 12px;
  margin-bottom:16px;
}
.comment-box textarea{
  width:100%;
  min-height:54px;
  border:none;
  background:transparent;
  resize:vertical;
  font-size:.84rem;
  outline:none;
}
.comment-box-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
}
.hint{font-size:.73rem;color:var(--mute)}

.feed{display:flex;flex-direction:column;gap:12px}
.comment-card{
  border:1px solid var(--line-strong);
  background:var(--bg);
  border-radius:9px;
  padding:11px 13px;
}
.comment-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:6px;
  font-size:.78rem;
  color:var(--mute);
}
.comment-author{font-weight:600;color:var(--ink)}
.comment-body{
  font-size:.85rem;
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--ink);
}
.act-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  font-size:.8rem;
  color:var(--mute);
}
.act-dot{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--lane);
  border:1px solid var(--line-strong);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--ink-soft);
  margin-top:1px;
}
.act-text strong{color:var(--ink);font-weight:600}

/* Small Modals (Label Manager & Trash) */
.small-dlg{width:min(460px,92vw)}
.small-dlg-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.small-dlg-head h2{margin:0;font-size:.95rem;font-weight:700}
.small-dlg-body{padding:16px 18px;max-height:65vh;overflow-y:auto}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.swatch{
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}
.swatch.active{outline:2px solid var(--ink);outline-offset:2px}
.label-manage-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 8px;
  border-radius:6px;
  border:1px solid var(--line);
  margin-bottom:6px;
}
.trash-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  margin-bottom:8px;
  background:var(--bg);
}

/* Toast Popup (Kan style) */
#toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:9px;
  padding:10px 14px;
  box-shadow:var(--shadow-pop);
  font-size:.82rem;
  font-weight:500;
  z-index:500;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .18s,transform .18s;
}
#toast.show{opacity:1;transform:translateY(0)}

@media (max-width:780px){
  .modal-body{flex-direction:column}
  .modal-side{width:100%;border-left:none;border-top:1px solid var(--line)}
  #card-dlg{height:92vh}
}
@media (max-width:600px){
  header{padding:12px 14px}
  main{padding:4px 14px 16px}
  .lane{flex-basis:84vw;width:84vw}
}
</style>
</head>
<body>

<header>
  <div class="board-title-wrap">
    <input id="board-title" aria-label="Nome do quadro" value="Meu Kanban">
    <span id="prefix-btn" class="prefix-pill" title="Alterar prefixo dos cartões">KAN</span>
  </div>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Buscar cartões..." aria-label="Buscar cartões">
  </div>

  <!-- Filtros estilo Kan -->
  <div class="rel">
    <button class="btn" id="filter-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filtros
    </button>
    <span id="filter-badge" class="count-dot" hidden>0</span>
    <div id="filter-pop" class="popover" style="min-width:250px"></div>
  </div>

  <button class="btn" id="labels-btn" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
    Etiquetas
  </button>

  <div class="rel">
    <button class="btn" id="trash-btn" type="button" title="Lixeira">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      Lixeira
    </button>
    <span id="trash-badge" class="count-dot" hidden>0</span>
  </div>

  <button class="btn icon-btn" id="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18V3z" fill="currentColor"/></svg>
  </button>

  <div class="rel">
    <button class="btn icon-btn" id="more-btn" title="Mais opções" aria-label="Mais opções">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
    <div id="more-pop" class="popover" style="min-width:190px">
      <button type="button" class="pop-item" id="export">Exportar JSON</button>
      <button type="button" class="pop-item" id="import">Importar JSON</button>
      <div class="pop-sep"></div>
      <button type="button" class="pop-item" id="reset-demo">Restaurar exemplo</button>
    </div>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</header>

<main id="board"></main>

<!-- Context Menu rápido no cartão -->
<div id="ctx-menu" class="ctx-menu"></div>

<!-- Modal Completo do Cartão (Kan Layout) -->
<dialog id="card-dlg">
  <div class="modal-shell">
    <div class="modal-topbar">
      <div class="breadcrumbs">
        <span id="m-crumb-board">Meu Kanban</span>
        <span class="muted">›</span>
        <span id="m-crumb-list">Lista</span>
        <span class="muted">›</span>
        <span id="m-crumb-num" class="muted">KAN-1</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button type="button" class="btn sm ghost" id="m-dup-btn" title="Duplicar cartão">Duplicar</button>
        <button type="button" class="btn sm ghost danger" id="m-del-btn" title="Mover para lixeira">Excluir</button>
        <button type="button" class="btn sm icon-btn ghost" id="m-close-btn" aria-label="Fechar">✕</button>
      </div>
    </div>

    <div class="modal-body">
      <div class="modal-main">
        <textarea id="m-title" rows="1" maxlength="160" placeholder="Título do cartão"></textarea>

        <div class="section-head">
          <h3>Descrição</h3>
        </div>
        <textarea id="m-desc" placeholder="Adicione detalhes, notas ou links..."></textarea>

        <div class="section-head">
          <h3>Checklists</h3>
          <button type="button" class="btn sm" id="m-add-cl">+ Adicionar checklist</button>
        </div>
        <div id="m-checklists"></div>

        <div class="activity-divider">
          <div class="section-head" style="margin-top:0">
            <h3>Atividade e Comentários</h3>
            <button type="button" class="btn sm ghost" id="m-sort-act">Mais recentes primeiro</button>
          </div>

          <div class="comment-box">
            <textarea id="m-comment-input" placeholder="Escreva um comentário..."></textarea>
            <div class="comment-box-foot">
              <span class="hint">Ctrl + Enter para enviar</span>
              <button type="button" class="btn sm primary" id="m-comment-submit">Comentar</button>
            </div>
          </div>

          <div id="m-feed" class="feed"></div>
        </div>
      </div>

      <aside class="modal-side">
        <div class="side-row">
          <span class="side-label">Lista</span>
          <select id="m-list" class="side-control"></select>
        </div>

        <div class="side-row">
          <span class="side-label">Etiquetas</span>
          <div id="m-labels-view" class="side-labels"></div>
          <div class="rel" style="margin-top:4px">
            <button type="button" class="btn sm" id="m-label-picker-btn">+ Gerenciar etiquetas</button>
            <div id="m-label-pop" class="popover left" style="min-width:220px"></div>
          </div>
        </div>

        <div class="side-row">
          <span class="side-label">Prazo</span>
          <div style="display:flex;gap:6px">
            <input type="date" id="m-due" class="side-control">
            <button type="button" class="btn sm icon-btn" id="m-due-clear" title="Remover prazo">✕</button>
          </div>
        </div>

        <div class="side-row">
          <span class="side-label">Posição na lista</span>
          <div id="m-pos-info" style="font-size:.8rem;color:var(--ink-soft)">#1</div>
        </div>

        <div class="side-row">
          <span class="side-label">Criado em</span>
          <div id="m-created-info" style="font-size:.78rem;color:var(--mute)">—</div>
        </div>
      </aside>
    </div>
  </div>
</dialog>

<!-- Modal Gerenciador de Etiquetas -->
<dialog id="labels-dlg" class="small-dlg">
  <div class="small-dlg-head">
    <h2>Etiquetas do quadro</h2>
    <button type="button" class="btn sm icon-btn ghost" onclick="document.getElementById('labels-dlg').close()">✕</button>
  </div>
  <div class="small-dlg-body">
    <form id="new-label-form" style="margin-bottom:14px">
      <div style="display:flex;gap:6px">
        <input id="new-label-name" placeholder="Nome da etiqueta..." maxlength="40" required style="flex:1;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:6px 9px;font-size:.84rem">
        <button type="submit" class="btn primary">Criar</button>
      </div>
      <div id="new-label-swatches" class="color-swatches"></div>

    <div id="labels-manage-list"></div>

</dialog>

<!-- Modal Lixeira (Soft Delete) -->
<dialog id="trash-dlg" class="small-dlg" style="width:min(540px,92vw)">
  <div class="small-dlg-head">
    <h2>Lixeira</h2>
    <div style="display:flex;gap:6px">
      <button type="button" class="btn sm danger" id="empty-trash-btn">Esvaziar lixeira</button>
      <button type="button" class="btn sm icon-btn ghost" onclick="document.getElementById('trash-dlg').close()">✕</button>
    </div>
  </div>
  <div class="small-dlg-body" id="trash-list"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const STORAGE_KEY = 'kanban:pessoal:v1';
  const KAN_COLOURS = [
    { name: 'Teal', code: '#0d9488' },
    { name: 'Green', code: '#65a30d' },
    { name: 'Blue', code: '#0284c7' },
    { name: 'Purple', code: '#4f46e5' },
    { name: 'Yellow', code: '#ca8a04' },
    { name: 'Orange', code: '#ea580c' },
    { name: 'Red', code: '#dc2626' },
    { name: 'Pink', code: '#db2777' }
  ];

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
  const nowIso = () => new Date().toISOString();
  const $ = id => document.getElementById(id);

  function el(tag, props, ...kids){
    const n = document.createElement(tag);
    if (props){
      for (const [k, v] of Object.entries(props)){
        if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
        else if (k.startsWith('on') && typeof v === 'function') n[k] = v;
        else if (v !== undefined && v !== null) n[k] = v;
      }
    }
    kids.forEach(k => { if (k !== null && k !== undefined && k !== false) n.append(k); });
    return n;
  }

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function defaultLabels(){
    return [
      { id: 'lbl-casa', name: 'Casa', colourCode: '#0d9488' },
      { id: 'lbl-estudos', name: 'Estudos', colourCode: '#0284c7' },
      { id: 'lbl-urgente', name: 'Urgente', colourCode: '#ea580c' },
      { id: 'lbl-saude', name: 'Saúde', colourCode: '#65a30d' }
    ];
  }

  function defaultState(){
    const c1 = uid(), c2 = uid(), c3 = uid();
    return {
      version: 2,
      boardName: 'Meu Kanban',
      cardPrefix: 'KAN',
      nextCardNumber: 3,
      labels: defaultLabels(),
      columns: [
        {
          id: c1, title: 'A fazer', index: 0, deletedAt: null,
          cards: [
            {
              id: uid(), cardNumber: 1, title: 'Planejar metas da semana',
              notes: 'Clique para abrir os detalhes, adicionar checklists, etiquetas ou anotações.',
              due: '', index: 0, labelIds: ['lbl-estudos'],
              checklists: [{
                id: uid(), name: 'Passos iniciais', index: 0,
                items: [
                  { id: uid(), title: 'Listar prioridades da semana', completed: true, index: 0 },
                  { id: uid(), title: 'Definir horários de foco', completed: false, index: 1 }
                ]
              }],
              comments: [],
              activities: [{ id: uid(), type: 'card.created', text: 'criou este cartão', createdAt: nowIso() }],
              createdAt: nowIso(), deletedAt: null
            }
          ]
        },
        {
          id: c2, title: 'Fazendo', index: 1, deletedAt: null,
          cards: [
            {
              id: uid(), cardNumber: 2, title: 'Organizar finanças pessoais',
              notes: '', due: new Date(Date.now() + 86400000 * 2).toISOString().slice(0,10),
              index: 0, labelIds: ['lbl-urgente'], checklists: [], comments: [],
              activities: [{ id: uid(), type: 'card.created', text: 'criou este cartão', createdAt: nowIso() }],
              createdAt: nowIso(), deletedAt: null
            }
          ]
        },
        { id: c3, title: 'Feito', index: 2, deletedAt: null, cards: [] }
      ]
    };
  }

  // Migração automática do formato v1 (prioridades -> etiquetas, indices sequenciais, etc.)
  function migrateState(raw){
    if (!raw || !Array.isArray(raw.columns)) return defaultState();
    const st = {
      version: 2,
      boardName: raw.boardName || 'Meu Kanban',
      cardPrefix: raw.cardPrefix || 'KAN',
      nextCardNumber: Number.isFinite(raw.nextCardNumber) ? raw.nextCardNumber : 1,
      labels: Array.isArray(raw.labels) ? raw.labels : defaultLabels(),
      columns: []
    };

    let maxNum = st.nextCardNumber - 1;

    st.columns = raw.columns.map((col, colIdx) => {
      const cards = Array.isArray(col.cards) ? col.cards.map((c, cIdx) => {
        const labelIds = Array.isArray(c.labelIds) ? [...c.labelIds] : [];
        let cardNumber = c.cardNumber;
        if (cardNumber == null){
          maxNum += 1;
          cardNumber = maxNum;
        } else if (cardNumber > maxNum){
          maxNum = cardNumber;
        }
        return {
          id: c.id || uid(),
          cardNumber,
          title: c.title || 'Sem título',
          notes: c.notes || '',
          due: c.due || '',
          index: cIdx,
          labelIds,
          checklists: Array.isArray(c.checklists) ? c.checklists : [],
          comments: Array.isArray(c.comments) ? c.comments : [],
          activities: Array.isArray(c.activities) && c.activities.length
            ? c.activities
            : [{ id: uid(), type: 'card.created', text: 'criou este cartão', createdAt: c.createdAt || nowIso() }],
          createdAt: c.createdAt || nowIso(),
          deletedAt: c.deletedAt || null
        };
      }) : [];

      return {
        id: col.id || uid(),
        title: col.title || 'Sem nome',
        index: colIdx,
        deletedAt: col.deletedAt || null,
        cards
      };
    });

    st.nextCardNumber = maxNum + 1;
    return st;
  }

  let state;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    state = saved ? migrateState(JSON.parse(saved)) : defaultState();
  } catch(e){
    state = defaultState();
  }

  // Garante índices sequenciais por lista e entre listas
  function normalizeIndices(){
    let colIdx = 0;
    state.columns.forEach(col => {
      if (!col.deletedAt){
        col.index = colIdx++;
      }
      let cardIdx = 0;
      col.cards.forEach(card => {
        if (!card.deletedAt){
          card.index = cardIdx++;
        }
      });
    });
  }

  function save(){
    normalizeIndices();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }

  // Estado de UI
  let query = '';
  let filters = { labels: [], due: [] }; // due: 'overdue' | 'today' | 'upcoming' | 'none'
  let activeCardId = null;
  let activityOrder = 'newest'; // 'newest' | 'oldest'
  let dragState = null; // { type: 'CARD'|'LANE', id, sourceColId }
  let selectedNewLabelColor = KAN_COLOURS[0].code;

  // Helpers de dados
  const activeColumns = () => state.columns.filter(c => !c.deletedAt).sort((a,b) => a.index - b.index);
  const activeCardsInCol = col => col.cards.filter(c => !c.deletedAt).sort((a,b) => a.index - b.index);

  function findCard(cardId, includeDeleted = false){
    for (const col of state.columns){
      const idx = col.cards.findIndex(c => c.id === cardId && (includeDeleted || !c.deletedAt));
      if (idx > -1) return { col, idx, card: col.cards[idx] };
    }
    return null;
  }

  function logActivity(card, type, text){
    card.activities.push({
      id: uid(),
      type,
      text,
      createdAt: nowIso()
    });
  }

  // Formatação de datas
  const todayStr = () => new Date().toISOString().slice(0,10);
  function fmtDateShort(isoDate){
    if (!isoDate) return '';
    const [y, m, d] = isoDate.split('-');
    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const curYear = String(new Date().getFullYear());
    return y === curYear ? `${Number(d)} ${months[Number(m)-1]}` : `${Number(d)} ${months[Number(m)-1]} ${y}`;
  }
  function fmtRelTime(iso){
    const diff = Math.max(0, Date.now() - new Date(iso).getTime());
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'agora mesmo';
    if (min < 60) return `há ${min} min`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `há ${hr}h`;
    const days = Math.floor(hr / 24);
    if (days < 30) return `há ${days}d`;
    return new Date(iso).toLocaleDateString('pt-BR');
  }

  // Filtro de cartões
  function matchesFilters(card){
    const q = query.trim().toLowerCase();
    if (q){
      const numTag = `${state.cardPrefix}-${card.cardNumber}`.toLowerCase();
      const hay = `${card.title} ${card.notes} ${numTag}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (filters.labels.length > 0){
      if (!filters.labels.some(lid => card.labelIds.includes(lid))) return false;
    }
    if (filters.due.length > 0){
      const t = todayStr();
      const matchedDue = filters.due.some(f => {
        if (f === 'none') return !card.due;
        if (!card.due) return false;
        if (f === 'overdue') return card.due < t;
        if (f === 'today') return card.due === t;
        if (f === 'upcoming') return card.due > t;
        return false;
      });
      if (!matchedDue) return false;
    }
    return true;
  }

  // SVG CircularProgress (Kan style)
  function renderCircularProgress(done, total){
    const r = 40;
    const c = 2 * Math.PI * r;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    const visualPct = pct === 0 ? 3 : pct;
    const offset = c - (visualPct / 100) * c;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('width', '14');
    svg.setAttribute('height', '14');
    svg.setAttribute('class', 'cl-ring');
    svg.innerHTML = `
      <circle cx="50" cy="50" r="${r}" stroke-width="14" class="cl-ring-bg"></circle>
      <circle cx="50" cy="50" r="${r}" stroke-width="14" stroke-dasharray="${c}" stroke-dashoffset="${offset}" class="cl-ring-fg ${pct === 100 ? 'complete' : ''}"></circle>
    `;
    return svg;
  }

  // Render principal do quadro
  function render(){
    $('board-title').value = state.boardName;
    $('prefix-btn').textContent = state.cardPrefix;
    updateBadges();

    const board = $('board');
    board.replaceChildren();

    const cols = activeColumns();
    cols.forEach((col, visualColIdx) => {
      board.append(renderLane(col, visualColIdx === cols.length - 1));
    });

    board.append(el('button', {
      type: 'button',
      className: 'new-lane-btn',
      textContent: '+ Nova lista',
      onclick: addColumn
    }));

    if (activeCardId && $('card-dlg').open){
      renderCardModal();
    }
  }

  function updateBadges(){
    const fCount = filters.labels.length + filters.due.length;
    const fBadge = $('filter-badge');
    fBadge.textContent = fCount;
    fBadge.hidden = fCount === 0;

    let trashCount = 0;
    state.columns.forEach(col => {
      if (col.deletedAt) trashCount++;
      else col.cards.forEach(c => { if (c.deletedAt) trashCount++; });
    });
    const tBadge = $('trash-badge');
    tBadge.textContent = trashCount;
    tBadge.hidden = trashCount === 0;
  }

  function renderLane(col, isLastCol){
    const allActive = activeCardsInCol(col);
    const shown = allActive.filter(matchesFilters);

    const lane = el('section', { className: 'lane' });
    lane.dataset.colId = col.id;

    // Cabeçalho da lista (também arrastável para reordenar listas)
    const head = el('div', { className: 'lane-head', draggable: true });

    const titleInput = el('input', {
      className: 'lane-title',
      value: col.title,
      ariaLabel: 'Nome da lista',
      onclick: e => e.stopPropagation(),
      onchange: () => {
        const val = titleInput.value.trim();
        if (val && val !== col.title){
          col.title = val;
          save();
          render();
        } else {
          titleInput.value = col.title;
        }
      },
      onkeydown: e => { if (e.key === 'Enter') titleInput.blur(); }
    });

    const addTopBtn = el('button', {
      type: 'button',
      className: 'lane-icon-btn',
      title: 'Adicionar cartão',
      innerHTML: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
      onclick: e => { e.stopPropagation(); createNewCardPrompt(col.id, 'start'); }
    });

    const menuWrap = el('div', { className: 'rel' });
    const pop = el('div', { className: 'popover', style: { minWidth: '175px' } });
    pop.append(
      el('button', {
        type: 'button', className: 'pop-item', textContent: '+ Adicionar cartão',
        onclick: () => { closeAllPopovers(); createNewCardPrompt(col.id, 'end'); }
      }),
      el('button', {
        type: 'button', className: 'pop-item danger', textContent: 'Mover lista para lixeira',
        onclick: () => {
          closeAllPopovers();
          col.deletedAt = nowIso();
          save();
          render();
          toast(`Lista "${col.title}" movida para a lixeira`);
        }
      })
    );

    const moreLaneBtn = el('button', {
      type: 'button',
      className: 'lane-icon-btn',
      title: 'Opções da lista',
      innerHTML: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>',
      onclick: e => {
        e.stopPropagation();
        const wasOpen = pop.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) pop.classList.add('open');
      }
    });
    menuWrap.append(moreLaneBtn, pop);

    head.append(titleInput, el('span', { className: 'lane-count', textContent: shown.length }), addTopBtn, menuWrap);

    // Drag de Lista
    head.ondragstart = e => {
      if (document.activeElement === titleInput) { e.preventDefault(); return; }
      dragState = { type: 'LANE', id: col.id };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', col.id);
      setTimeout(() => lane.classList.add('dragging-lane'), 0);
    };
    head.ondragend = () => {
      dragState = null;
      document.querySelectorAll('.dragging-lane,.lane-drop-target').forEach(n => n.classList.remove('dragging-lane','lane-drop-target'));
    };

    const listEl = el('div', { className: 'cards' });
    shown.forEach(card => listEl.append(renderCard(card, col, isLastCol)));

    if (!shown.length){
      listEl.append(el('div', {
        className: 'empty-lane',
        textContent: (query || filters.labels.length || filters.due.length) ? 'Nenhum cartão corresponde ao filtro' : 'Arraste cartões para cá'
      }));
    }

    const addBottomBtn = el('button', {
      type: 'button',
      className: 'add-card-inline',
      innerHTML: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Adicionar cartão</span>',
      onclick: () => createNewCardPrompt(col.id, 'end')
    });

    lane.append(head, listEl, addBottomBtn);

    // Drag & Drop handlers na coluna
    lane.addEventListener('dragover', e => {
      if (!dragState) return;
      e.preventDefault();
      if (dragState.type === 'CARD'){
        lane.classList.add('over');
      } else if (dragState.type === 'LANE' && dragState.id !== col.id){
        lane.classList.add('lane-drop-target');
      }
    });
    lane.addEventListener('dragleave', e => {
      if (!lane.contains(e.relatedTarget)){
        lane.classList.remove('over', 'lane-drop-target');
      }
    });
    lane.addEventListener('drop', e => {
      e.preventDefault();
      lane.classList.remove('over', 'lane-drop-target');
      if (!dragState) return;
      if (dragState.type === 'CARD'){
        dropCard(col, listEl, e.clientY);
      } else if (dragState.type === 'LANE' && dragState.id !== col.id){
        dropLane(dragState.id, col.id);
      }
    });

    return lane;
  }

  function renderCard(c, col, isLastCol){
    const card = el('div', { className: 'card', draggable: true, tabIndex: 0 });
    card.dataset.id = c.id;

    // Número estilo Kan (KAN-1)
    card.append(el('span', { className: 'card-num', textContent: `${state.cardPrefix}-${c.cardNumber}` }));
    card.append(el('div', { className: 'card-title', textContent: c.title }));

    const cardLabels = c.labelIds
      .map(lid => state.labels.find(l => l.id === lid))
      .filter(Boolean);

    const hasNotes = (c.notes || '').trim().length > 0;
    const hasDue = !!c.due;
    const commentCount = (c.comments || []).length;
    const totalCl = (c.checklists || []).reduce((acc, cl) => acc + cl.items.length, 0);
    const doneCl = (c.checklists || []).reduce((acc, cl) => acc + cl.items.filter(i => i.completed).length, 0);

    if (cardLabels.length || hasNotes || hasDue || commentCount > 0 || totalCl > 0){
      const footer = el('div', { className: 'card-footer' });

      if (cardLabels.length){
        const labelsRow = el('div', { className: 'card-labels' });
        cardLabels.forEach(lbl => {
          labelsRow.append(el('span', { className: 'badge' },
            el('span', { className: 'badge-dot', style: { backgroundColor: lbl.colourCode } }),
            el('span', { textContent: lbl.name })
          ));
        });
        footer.append(labelsRow);
      }

      if (hasNotes || hasDue || commentCount > 0 || totalCl > 0){
        const metaRow = el('div', { className: 'card-meta-row' });
        const left = el('div', { className: 'card-meta-left' });

        if (hasNotes){
          left.append(el('span', {
            className: 'meta-item',
            title: 'Tem descrição',
            innerHTML: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>'
          }));
        }

        if (hasDue){
          const overdue = c.due < todayStr() && !isLastCol;
          const dueSpan = el('span', {
            className: 'meta-item' + (overdue ? ' overdue' : (isLastCol ? ' done-due' : '')),
            title: `Prazo: ${c.due.split('-').reverse().join('/')}`,
            innerHTML: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg><span>${fmtDateShort(c.due)}</span>`
          });
          left.append(dueSpan);
        }

        if (commentCount > 0){
          left.append(el('span', {
            className: 'meta-item',
            title: `${commentCount} comentário(s)`,
            innerHTML: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${commentCount}</span>`
          }));
        }

        metaRow.append(left);

        if (totalCl > 0){
          metaRow.append(el('div', { className: 'cl-pill', title: 'Checklist' },
            renderCircularProgress(doneCl, totalCl),
            el('span', { textContent: `${doneCl}/${totalCl}` })
          ));
        }

        footer.append(metaRow);
      }

      card.append(footer);
    }

    card.onclick = () => openCardModal(c.id);
    card.onkeydown = e => { if (e.key === 'Enter') openCardModal(c.id); };
    card.oncontextmenu = e => { e.preventDefault(); openContextMenu(e.clientX, e.clientY, c.id); };

    card.ondragstart = e => {
      e.stopPropagation();
      dragState = { type: 'CARD', id: c.id, sourceColId: col.id };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', c.id);
      setTimeout(() => card.classList.add('dragging'), 0);
    };
    card.ondragend = () => {
      dragState = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.over').forEach(n => n.classList.remove('over'));
    };

    return card;
  }

  // Reordenar e mover cartões mantendo índices sequenciais por lista
  function dropCard(targetCol, listEl, clientY){
    const found = findCard(dragState.id);
    if (!found) return;

    const fromCol = found.col;
    const movedCard = found.card;
    fromCol.cards.splice(found.idx, 1);

    const visibleNodes = [...listEl.querySelectorAll('.card:not(.dragging)')];
    const nextNode = visibleNodes.find(n => {
      const r = n.getBoundingClientRect();
      return clientY < r.top + r.height / 2;
    });

    const activeTargetCards = activeCardsInCol(targetCol);
    let targetActivePos = activeTargetCards.length;
    if (nextNode){
      const pos = activeTargetCards.findIndex(c => c.id === nextNode.dataset.id);
      if (pos > -1) targetActivePos = pos;
    }

    // Reinsere no array interno mantendo a ordem relativa
    const deletedCards = targetCol.cards.filter(c => c.deletedAt);
    activeTargetCards.splice(targetActivePos, 0, movedCard);
    targetCol.cards = [...activeTargetCards, ...deletedCards];

    if (fromCol.id !== targetCol.id){
      logActivity(movedCard, 'card.updated.list', `moveu de "${fromCol.title}" para "${targetCol.title}"`);
    }

    dragState = null;
    save();
    render();
  }

  function dropLane(sourceColId, targetColId){
    const cols = activeColumns();
    const deletedCols = state.columns.filter(c => c.deletedAt);
    const fromIdx = cols.findIndex(c => c.id === sourceColId);
    const toIdx = cols.findIndex(c => c.id === targetColId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = cols.splice(fromIdx, 1);
    cols.splice(toIdx, 0, moved);
    state.columns = [...cols, ...deletedCols];
    dragState = null;
    save();
    render();
  }

  function addColumn(){
    const name = prompt('Nome da nova lista:');
    if (!name || !name.trim()) return;
    state.columns.push({
      id: uid(),
      title: name.trim(),
      index: activeColumns().length,
      deletedAt: null,
      cards: []
    });
    save();
    render();
  }

  function createNewCardPrompt(colId, position = 'end'){
    const col = state.columns.find(c => c.id === colId && !c.deletedAt);
    if (!col) return;
    const title = prompt(`Novo cartão em "${col.title}":`);
    if (!title || !title.trim()) return;

    const newCard = {
      id: uid(),
      cardNumber: state.nextCardNumber++,
      title: title.trim(),
      notes: '',
      due: '',
      index: 0,
      labelIds: [],
      checklists: [],
      comments: [],
      activities: [{ id: uid(), type: 'card.created', text: 'criou este cartão', createdAt: nowIso() }],
      createdAt: nowIso(),
      deletedAt: null
    };

    const actives = activeCardsInCol(col);
    const deleteds = col.cards.filter(c => c.deletedAt);
    if (position === 'start') actives.unshift(newCard);
    else actives.push(newCard);
    col.cards = [...actives, ...deleteds];

    save();
    render();
    openCardModal(newCard.id);
  }

  // Menu de Contexto (botão direito no cartão)
  function openContextMenu(x, y, cardId){
    const menu = $('ctx-menu');
    menu.replaceChildren(
      el('button', { type: 'button', className: 'pop-item', textContent: 'Abrir cartão', onclick: () => { closeContextMenu(); openCardModal(cardId); } }),
      el('button', { type: 'button', className: 'pop-item', textContent: 'Duplicar cartão', onclick: () => { closeContextMenu(); duplicateCard(cardId); } }),
      el('div', { className: 'pop-sep' }),
      el('button', { type: 'button', className: 'pop-item danger', textContent: 'Mover para lixeira', onclick: () => { closeContextMenu(); softDeleteCard(cardId); } })
    );
    menu.style.left = Math.min(x, window.innerWidth - 210) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 140) + 'px';
    menu.classList.add('open');
  }
  function closeContextMenu(){ $('ctx-menu').classList.remove('open'); }

  function duplicateCard(cardId){
    const f = findCard(cardId);
    if (!f) return;
    const copy = JSON.parse(JSON.stringify(f.card));
    copy.id = uid();
    copy.cardNumber = state.nextCardNumber++;
    copy.title = `${f.card.title} (cópia)`;
    copy.createdAt = nowIso();
    copy.comments = [];
    copy.activities = [{ id: uid(), type: 'card.created', text: `duplicou a partir de ${state.cardPrefix}-${f.card.cardNumber}`, createdAt: nowIso() }];
    copy.checklists.forEach(cl => {
      cl.id = uid();
      cl.items.forEach(it => { it.id = uid(); });
    });

    const actives = activeCardsInCol(f.col);
    const deleteds = f.col.cards.filter(c => c.deletedAt);
    const pos = actives.findIndex(c => c.id === cardId);
    actives.splice(pos + 1, 0, copy);
    f.col.cards = [...actives, ...deleteds];
    save();
    render();
    toast(`Cartão duplicado (${state.cardPrefix}-${copy.cardNumber})`);
  }

  function softDeleteCard(cardId){
    const f = findCard(cardId);
    if (!f) return;
    f.card.deletedAt = nowIso();
    logActivity(f.card, 'card.archived', 'moveu o cartão para a lixeira');
    if (activeCardId === cardId){
      activeCardId = null;
      $('card-dlg').close();
    }
    save();
    render();
    toast(`Cartão ${state.cardPrefix}-${f.card.cardNumber} movido para a lixeira`);
  }

  // Modal do Cartão (Kan CardView)
  function openCardModal(cardId){
    const f = findCard(cardId);
    if (!f) return;
    activeCardId = cardId;
    renderCardModal();
    if (!$('card-dlg').open) $('card-dlg').showModal();
  }

  function renderCardModal(){
    const f = findCard(activeCardId);
    if (!f) return;
    const { col, card } = f;

    $('m-crumb-board').textContent = state.boardName;
    $('m-crumb-list').textContent = col.title;
    $('m-crumb-num').textContent = `${state.cardPrefix}-${card.cardNumber}`;

    const titleEl = $('m-title');
    if (document.activeElement !== titleEl){
      titleEl.value = card.title;
      titleEl.style.height = 'auto';
      titleEl.style.height = titleEl.scrollHeight + 'px';
    }

    const descEl = $('m-desc');
    if (document.activeElement !== descEl){
      descEl.value = card.notes || '';
    }

    // Lista select
    const listSel = $('m-list');
    listSel.replaceChildren(...activeColumns().map(c => el('option', { value: c.id, textContent: c.title })));
    listSel.value = col.id;

    // Prazo
    $('m-due').value = card.due || '';

    // Posição & Criado em
    $('m-pos-info').textContent = `#${card.index + 1} de ${activeCardsInCol(col).length}`;
    $('m-created-info').textContent = new Date(card.createdAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

    // Etiquetas selecionadas na lateral
    const labelsView = $('m-labels-view');
    labelsView.replaceChildren();
    const cardLabels = card.labelIds.map(id => state.labels.find(l => l.id === id)).filter(Boolean);
    if (!cardLabels.length){
      labelsView.append(el('span', { style: { fontSize: '.78rem', color: 'var(--mute)' }, textContent: 'Nenhuma etiqueta' }));
    } else {
      cardLabels.forEach(lbl => {
        labelsView.append(el('button', {
          type: 'button',
          className: 'label-chip-btn',
          title: 'Clique para remover',
          onclick: () => toggleCardLabel(card.id, lbl.id)
        },
          el('span', { className: 'badge-dot', style: { backgroundColor: lbl.colourCode } }),
          el('span', { textContent: lbl.name }),
          el('span', { style: { color: 'var(--mute)', marginLeft: '2px' }, textContent: '×' })
        ));
      });
    }

    renderCardChecklists(card);
    renderCardFeed(card);
  }

  function toggleCardLabel(cardId, labelId){
    const f = findCard(cardId);
    if (!f) return;
    const lbl = state.labels.find(l => l.id === labelId);
    const idx = f.card.labelIds.indexOf(labelId);
    if (idx > -1){
      f.card.labelIds.splice(idx, 1);
      if (lbl) logActivity(f.card, 'card.updated.label.removed', `removeu a etiqueta "${lbl.name}"`);
    } else {
      f.card.labelIds.push(labelId);
      if (lbl) logActivity(f.card, 'card.updated.label.added', `adicionou a etiqueta "${lbl.name}"`);
    }
    save();
    render();
    if ($('m-label-pop').classList.contains('open')) renderLabelPickerPopover(f.card);
  }

  function renderLabelPickerPopover(card){
    const pop = $('m-label-pop');
    pop.replaceChildren();
    if (!state.labels.length){
      pop.append(el('div', { className: 'empty-lane', textContent: 'Nenhuma etiqueta criada' }));
    } else {
      state.labels.forEach(lbl => {
        const checked = card.labelIds.includes(lbl.id);
        pop.append(el('button', {
          type: 'button',
          className: 'pop-item',
          onclick: e => { e.stopPropagation(); toggleCardLabel(card.id, lbl.id); }
        },
          el('input', { type: 'checkbox', checked }),
          el('span', { className: 'badge-dot', style: { backgroundColor: lbl.colourCode } }),
          el('span', { textContent: lbl.name, style: { flex: 1 } })
        ));
      });
    }
    pop.append(
      el('div', { className: 'pop-sep' }),
      el('button', {
        type: 'button',
        className: 'pop-item',
        textContent: '+ Criar nova etiqueta...',
        onclick: () => { closeAllPopovers(); openLabelsManager(); }
      })
    );
  }

  function renderCardChecklists(card){
    const wrap = $('m-checklists');
    wrap.replaceChildren();
    if (!card.checklists.length){
      wrap.append(el('div', { style: { fontSize: '.8rem', color: 'var(--mute)' }, textContent: 'Nenhuma checklist neste cartão.' }));
      return;
    }

    card.checklists.forEach((cl, clIdx) => {
      const done = cl.items.filter(i => i.completed).length;
      const total = cl.items.length;

      const block = el('div', { className: 'checklist-block' });
      const top = el('div', { className: 'checklist-top' });

      const nameInp = el('input', {
        className: 'checklist-name',
        value: cl.name,
        onchange: () => {
          const val = nameInp.value.trim();
          if (val && val !== cl.name){
            cl.name = val;
            logActivity(card, 'card.updated.checklist.renamed', `renomeou checklist para "${val}"`);
            save();
            render();
          } else nameInp.value = cl.name;
        }
      });

      const pill = el('div', { className: 'cl-pill', style: { marginLeft: 0 } },
        renderCircularProgress(done, total),
        el('span', { textContent: `${done}/${total}` })
      );

      const delClBtn = el('button', {
        type: 'button',
        className: 'btn sm ghost danger',
        title: 'Excluir checklist',
        textContent: '✕',
        onclick: () => {
          card.checklists.splice(clIdx, 1);
          logActivity(card, 'card.updated.checklist.deleted', `excluiu a checklist "${cl.name}"`);
          save();
          render();
        }
      });

      top.append(nameInp, pill, delClBtn);
      block.append(top);

      const itemsList = el('div', { className: 'cl-items' });
      cl.items.forEach((item, itemIdx) => {
        const row = el('div', { className: 'cl-item' });
        const cb = el('input', {
          type: 'checkbox',
          checked: item.completed,
          onchange: () => {
            item.completed = cb.checked;
            logActivity(
              card,
              item.completed ? 'card.updated.checklist.item.completed' : 'card.updated.checklist.item.uncompleted',
              `${item.completed ? 'concluiu' : 'reabriu'} "${item.title}"`
            );
            save();
            render();
          }
        });

        const txt = el('input', {
          className: 'cl-item-text' + (item.completed ? ' done' : ''),
          value: item.title,
          onchange: () => {
            const val = txt.value.trim();
            if (val && val !== item.title){
              item.title = val;
              save();
              render();
            } else txt.value = item.title;
          }
        });

        const delIt = el('button', {
          type: 'button',
          className: 'cl-item-del',
          textContent: '✕',
          title: 'Remover item',
          onclick: () => {
            cl.items.splice(itemIdx, 1);
            logActivity(card, 'card.updated.checklist.item.deleted', `removeu o item "${item.title}"`);
            save();
            render();
          }
        });

        row.append(cb, txt, delIt);
        itemsList.append(row);
      });
      block.append(itemsList);

      const addInput = el('input', { placeholder: 'Adicionar item...' });
      const addItemFn = () => {
        const val = addInput.value.trim();
        if (!val) return;
        cl.items.push({ id: uid(), title: val, completed: false, index: cl.items.length });
        logActivity(card, 'card.updated.checklist.item.added', `adicionou "${val}" em "${cl.name}"`);
        addInput.value = '';
        save();
        render();
      };
      addInput.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addItemFn(); } };

      block.append(el('div', { className: 'cl-add-row' },
        addInput,
        el('button', { type: 'button', className: 'btn sm', textContent: 'Adicionar', onclick: addItemFn })
      ));

      wrap.append(block);
    });
  }

  function renderCardFeed(card){
    $('m-sort-act').textContent = activityOrder === 'newest' ? 'Mais recentes primeiro' : 'Mais antigos primeiro';
    const feed = $('m-feed');
    feed.replaceChildren();

    const merged = [
      ...(card.comments || []).map(c => ({ kind: 'comment', data: c, createdAt: c.createdAt })),
      ...(card.activities || []).map(a => ({ kind: 'activity', data: a, createdAt: a.createdAt }))
    ];

    merged.sort((a, b) => {
      const diff = new Date(a.createdAt) - new Date(b.createdAt);
      return activityOrder === 'newest' ? -diff : diff;
    });

    merged.forEach(entry => {
      if (entry.kind === 'comment'){
        const cm = entry.data;
        const cCard = el('div', { className: 'comment-card' });
        const head = el('div', { className: 'comment-head' },
          el('div', {},
            el('span', { className: 'comment-author', textContent: 'Você ' }),
            el('span', { textContent: `· ${fmtRelTime(cm.createdAt)}${cm.updatedAt ? ' (editado)' : ''}` })
          ),
          el('div', { style: { display: 'flex', gap: '4px' } },
            el('button', {
              type: 'button', className: 'btn sm ghost', textContent: 'Editar',
              onclick: () => {
                const edited = prompt('Editar comentário:', cm.text);
                if (edited !== null && edited.trim() && edited.trim() !== cm.text){
                  cm.text = edited.trim();
                  cm.updatedAt = nowIso();
                  save();
                  render();
                }
              }
            }),
            el('button', {
              type: 'button', className: 'btn sm ghost danger', textContent: 'Excluir',
              onclick: () => {
                card.comments = card.comments.filter(x => x.id !== cm.id);
                logActivity(card, 'card.updated.comment.deleted', 'excluiu um comentário');
                save();
                render();
              }
            })
          )
        );
        cCard.append(head, el('div', { className: 'comment-body', textContent: cm.text }));
        feed.append(cCard);
      } else {
        const act = entry.data;
        feed.append(el('div', { className: 'act-row' },
          el('div', { className: 'act-dot', innerHTML: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/></svg>' }),
          el('div', { className: 'act-text' },
            el('strong', { textContent: 'Você ' }),
            el('span', { textContent: `${act.text} · ${fmtRelTime(act.createdAt)}` })
          )
        ));
      }
    });
  }

  // Eventos do Modal do Cartão
  $('m-close-btn').onclick = () => { activeCardId = null; $('card-dlg').close(); };
  $('card-dlg').addEventListener('close', () => { activeCardId = null; });

  $('m-title').addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = e.target.scrollHeight + 'px';
  });
  $('m-title').addEventListener('blur', () => {
    const f = findCard(activeCardId);
    if (!f) return;
    const val = $('m-title').value.trim();
    if (val && val !== f.card.title){
      f.card.title = val;
      logActivity(f.card, 'card.updated.title', `alterou o título para "${val}"`);
      save();
      render();
    } else {
      $('m-title').value = f.card.title;
    }
  });
  $('m-title').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('m-title').blur(); }
  });

  $('m-desc').addEventListener('blur', () => {
    const f = findCard(activeCardId);
    if (!f) return;
    const val = $('m-desc').value;
    if (val !== (f.card.notes || '')){
      f.card.notes = val;
      logActivity(f.card, 'card.updated.description', 'atualizou a descrição');
      save();
      render();
    }
  });

  $('m-list').addEventListener('change', () => {
    const f = findCard(activeCardId);
    if (!f) return;
    const targetCol = state.columns.find(c => c.id === $('m-list').value && !c.deletedAt);
    if (!targetCol || targetCol.id === f.col.id) return;
    const fromTitle = f.col.title;
    f.col.cards.splice(f.idx, 1);
    const actives = activeCardsInCol(targetCol);
    const deleteds = targetCol.cards.filter(c => c.deletedAt);
    actives.push(f.card);
    targetCol.cards = [...actives, ...deleteds];
    logActivity(f.card, 'card.updated.list', `moveu de "${fromTitle}" para "${targetCol.title}"`);
    save();
    render();
  });

  $('m-due').addEventListener('change', () => {
    const f = findCard(activeCardId);
    if (!f) return;
    const val = $('m-due').value;
    if (val !== (f.card.due || '')){
      f.card.due = val;
      logActivity(f.card, val ? 'card.updated.dueDate.updated' : 'card.updated.dueDate.removed',
        val ? `definiu o prazo para ${val.split('-').reverse().join('/')}` : 'removeu o prazo');
      save();
      render();
    }
  });

  $('m-due-clear').onclick = () => {
    const f = findCard(activeCardId);
    if (!f || !f.card.due) return;
    f.card.due = '';
    logActivity(f.card, 'card.updated.dueDate.removed', 'removeu o prazo');
    save();
    render();
  };

  $('m-add-cl').onclick = () => {
    const f = findCard(activeCardId);
    if (!f) return;
    const name = prompt('Nome da checklist:', 'Checklist');
    if (!name || !name.trim()) return;
    f.card.checklists.push({ id: uid(), name: name.trim(), index: f.card.checklists.length, items: [] });
    logActivity(f.card, 'card.updated.checklist.added', `adicionou a checklist "${name.trim()}"`);
    save();
    render();
  };

  $('m-label-picker-btn').onclick = e => {
    e.stopPropagation();
    const f = findCard(activeCardId);
    if (!f) return;
    const pop = $('m-label-pop');
    const wasOpen = pop.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen){
      renderLabelPickerPopover(f.card);
      pop.classList.add('open');
    }
  };

  function submitComment(){
    const f = findCard(activeCardId);
    if (!f) return;
    const inp = $('m-comment-input');
    const text = inp.value.trim();
    if (!text) return;
    f.card.comments.push({ id: uid(), text, createdAt: nowIso(), updatedAt: null });
    inp.value = '';
    save();
    render();
  }
  $('m-comment-submit').onclick = submitComment;
  $('m-comment-input').onkeydown = e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); submitComment(); }
  };

  $('m-sort-act').onclick = () => {
    activityOrder = activityOrder === 'newest' ? 'oldest' : 'newest';
    renderCardModal();
  };

  $('m-dup-btn').onclick = () => { if (activeCardId) duplicateCard(activeCardId); };
  $('m-del-btn').onclick = () => { if (activeCardId) softDeleteCard(activeCardId); };

  // Gerenciador de Etiquetas
  function openLabelsManager(){
    renderLabelsManager();
    $('labels-dlg').showModal();
  }

  function renderLabelsManager(){
    const swatches = $('new-label-swatches');
    swatches.replaceChildren(...KAN_COLOURS.map(c => el('button', {
      type: 'button',
      className: 'swatch' + (selectedNewLabelColor === c.code ? ' active' : ''),
      style: { backgroundColor: c.code },
      title: c.name,
      onclick: () => { selectedNewLabelColor = c.code; renderLabelsManager(); }
    })));

    const list = $('labels-manage-list');
    list.replaceChildren();
    if (!state.labels.length){
      list.append(el('div', { className: 'empty-lane', textContent: 'Nenhuma etiqueta cadastrada.' }));
      return;
    }

    state.labels.forEach((lbl, idx) => {
      const nameInp = el('input', {
        value: lbl.name,
        style: { flex: 1, background: 'transparent', border: '1px solid transparent', borderRadius: '4px', padding: '3px 6px', fontSize: '.84rem' },
        onchange: () => {
          const val = nameInp.value.trim();
          if (val){ lbl.name = val; save(); render(); }
          else nameInp.value = lbl.name;
        }
      });
      nameInp.onfocus = () => { nameInp.style.borderColor = 'var(--line-strong)'; nameInp.style.background = 'var(--bg)'; };
      nameInp.onblur = () => { nameInp.style.borderColor = 'transparent'; nameInp.style.background = 'transparent'; };

      const colorCycleBtn = el('button', {
        type: 'button',
        className: 'swatch',
        style: { width: '18px', height: '18px', backgroundColor: lbl.colourCode, flexShrink: 0 },
        title: 'Clique para alternar cor',
        onclick: () => {
          const cur = KAN_COLOURS.findIndex(c => c.code === lbl.colourCode);
          lbl.colourCode = KAN_COLOURS[(cur + 1) % KAN_COLOURS.length].code;
          save();
          renderLabelsManager();
          render();
        }
      });

      const delBtn = el('button', {
        type: 'button',
        className: 'btn sm ghost danger',
        textContent: 'Excluir',
        onclick: () => {
          state.labels.splice(idx, 1);
          state.columns.forEach(col => col.cards.forEach(c => {
            c.labelIds = c.labelIds.filter(id => id !== lbl.id);
          }));
          save();
          renderLabelsManager();
          render();
        }
      });

      list.append(el('div', { className: 'label-manage-row' }, colorCycleBtn, nameInp, delBtn));
    });
  }

  $('labels-btn').onclick = openLabelsManager;
  $('new-label-form').onsubmit = e => {
    e.preventDefault();
    const inp = $('new-label-name');
    const name = inp.value.trim();
    if (!name) return;
    state.labels.push({ id: uid(), name, colourCode: selectedNewLabelColor });
    inp.value = '';
    save();
    renderLabelsManager();
    render();
  };

  // Lixeira (Soft Delete)
  function openTrashModal(){
    renderTrashModal();
    $('trash-dlg').showModal();
  }

  function renderTrashModal(){
    const list = $('trash-list');
    list.replaceChildren();

    const deletedCols = state.columns.filter(c => c.deletedAt);
    const deletedCards = [];
    state.columns.forEach(col => {
      if (!col.deletedAt){
        col.cards.forEach(c => { if (c.deletedAt) deletedCards.push({ col, card: c }); });
      }
    });

    if (!deletedCols.length && !deletedCards.length){
      list.append(el('div', { className: 'empty-lane', textContent: 'A lixeira está vazia.' }));
      return;
    }

    if (deletedCols.length){
      list.append(el('div', { className: 'pop-title', textContent: 'Listas excluídas' }));
      deletedCols.forEach(col => {
        list.append(el('div', { className: 'trash-row' },
          el('div', {},
            el('div', { style: { fontWeight: 600 }, textContent: col.title }),
            el('div', { style: { fontSize: '.75rem', color: 'var(--mute)' }, textContent: `${col.cards.length} cartão(ões) · excluída ${fmtRelTime(col.deletedAt)}` })
          ),
          el('div', { style: { display: 'flex', gap: '6px' } },
            el('button', {
              type: 'button', className: 'btn sm', textContent: 'Restaurar',
              onclick: () => {
                col.deletedAt = null;
                col.cards.forEach(c => { c.deletedAt = null; });
                save(); renderTrashModal(); render();
                toast(`Lista "${col.title}" restaurada`);
              }
            }),
            el('button', {
              type: 'button', className: 'btn sm danger', textContent: 'Apagar',
              onclick: () => {
                state.columns = state.columns.filter(c => c.id !== col.id);
                save(); renderTrashModal(); render();
              }
            })
          )
        ));
      });
    }

    if (deletedCards.length){
      list.append(el('div', { className: 'pop-title', textContent: 'Cartões excluídos' }));
      deletedCards.forEach(({ col, card }) => {
        list.append(el('div', { className: 'trash-row' },
          el('div', { style: { minWidth: 0 } },
            el('div', { style: { fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, textContent: `${state.cardPrefix}-${card.cardNumber} · ${card.title}` }),
            el('div', { style: { fontSize: '.75rem', color: 'var(--mute)' }, textContent: `Lista: ${col.title} · ${fmtRelTime(card.deletedAt)}` })
          ),
          el('div', { style: { display: 'flex', gap: '6px', flexShrink: 0 } },
            el('button', {
              type: 'button', className: 'btn sm', textContent: 'Restaurar',
              onclick: () => {
                card.deletedAt = null;
                logActivity(card, 'card.restored', 'restaurou o cartão da lixeira');
                save(); renderTrashModal(); render();
                toast(`Cartão ${state.cardPrefix}-${card.cardNumber} restaurado`);
              }
            }),
            el('button', {
              type: 'button', className: 'btn sm danger', textContent: 'Apagar',
              onclick: () => {
                col.cards = col.cards.filter(c => c.id !== card.id);
                save(); renderTrashModal(); render();
              }
            })
          )
        ));
      });
    }
  }

  $('trash-btn').onclick = openTrashModal;
  $('empty-trash-btn').onclick = () => {
    if (!confirm('Apagar definitivamente todos os itens da lixeira?')) return;
    state.columns = state.columns.filter(c => !c.deletedAt);
    state.columns.forEach(col => {
      col.cards = col.cards.filter(c => !c.deletedAt);
    });
    save();
    renderTrashModal();
    render();
    toast('Lixeira esvaziada');
  };

  // Popover de Filtros (Kan style)
  function renderFilterPopover(){
    const pop = $('filter-pop');
    pop.replaceChildren();

    pop.append(el('div', { className: 'pop-title', textContent: 'Etiquetas' }));
    if (!state.labels.length){
      pop.append(el('div', { style: { padding: '4px 8px', fontSize: '.78rem', color: 'var(--mute)' }, textContent: 'Sem etiquetas' }));
    } else {
      state.labels.forEach(lbl => {
        const active = filters.labels.includes(lbl.id);
        pop.append(el('button', {
          type: 'button', className: 'pop-item',
          onclick: e => {
            e.stopPropagation();
            if (active) filters.labels = filters.labels.filter(id => id !== lbl.id);
            else filters.labels.push(lbl.id);
            renderFilterPopover();
            render();
          }
        },
          el('input', { type: 'checkbox', checked: active }),
          el('span', { className: 'badge-dot', style: { backgroundColor: lbl.colourCode } }),
          el('span', { textContent: lbl.name })
        ));
      });
    }

    pop.append(el('div', { className: 'pop-sep' }), el('div', { className: 'pop-title', textContent: 'Prazo' }));
    const dueOpts = [
      { key: 'overdue', label: 'Atrasados' },
      { key: 'today', label: 'Vence hoje' },
      { key: 'upcoming', label: 'Próximos dias' },
      { key: 'none', label: 'Sem prazo' }
    ];
    dueOpts.forEach(opt => {
      const active = filters.due.includes(opt.key);
      pop.append(el('button', {
        type: 'button', className: 'pop-item',
        onclick: e => {
          e.stopPropagation();
          if (active) filters.due = filters.due.filter(k => k !== opt.key);
          else filters.due.push(opt.key);
          renderFilterPopover();
          render();
        }
      },
        el('input', { type: 'checkbox', checked: active }),
        el('span', { textContent: opt.label })
      ));
    });

    if (filters.labels.length || filters.due.length){
      pop.append(
        el('div', { className: 'pop-sep' }),
        el('button', {
          type: 'button', className: 'pop-item danger', textContent: 'Limpar filtros',
          onclick: () => { filters = { labels: [], due: [] }; renderFilterPopover(); render(); }
        })
      );
    }
  }

  $('filter-btn').onclick = e => {
    e.stopPropagation();
    const pop = $('filter-pop');
    const wasOpen = pop.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen){
      renderFilterPopover();
      pop.classList.add('open');
    }
  };

  $('more-btn').onclick = e => {
    e.stopPropagation();
    const pop = $('more-pop');
    const wasOpen = pop.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen) pop.classList.add('open');
  };

  function closeAllPopovers(){
    document.querySelectorAll('.popover.open').forEach(p => p.classList.remove('open'));
    closeContextMenu();
  }
  document.addEventListener('click', closeAllPopovers);

  // Título e prefixo do quadro
  $('board-title').onchange = () => {
    const val = $('board-title').value.trim();
    if (val){ state.boardName = val; save(); render(); }
    else $('board-title').value = state.boardName;
  };
  $('prefix-btn').onclick = () => {
    const p = prompt('Prefixo dos cartões (ex: KAN, TASK, PROJ):', state.cardPrefix);
    if (p && p.trim()){
      state.cardPrefix = p.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) || 'KAN';
      save();
      render();
    }
  };

  // Busca
  $('search').oninput = e => { query = e.target.value; render(); };

  // Tema claro/escuro
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('kanban:theme');
  if (savedTheme) root.dataset.theme = savedTheme;
  $('theme').onclick = () => {
    const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark';
    try { localStorage.setItem('kanban:theme', root.dataset.theme); } catch(e){}
  };

  // Exportar / Importar / Restaurar
  $('export').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'kanban-' + todayStr() + '.json' });
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('import').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      if (!Array.isArray(parsed.columns)) throw new Error();
      if (!confirm('Importar substitui o quadro atual. Continuar?')) return;
      state = migrateState(parsed);
      save();
      render();
      toast('Quadro importado com sucesso');
    } catch(err){
      alert('Arquivo inválido. Use um JSON exportado por este Kanban.');
    }
  };
  $('reset-demo').onclick = () => {
    if (!confirm('Substituir o quadro atual pelo quadro de exemplo?')) return;
    state = defaultState();
    save();
    render();
  };

  save();
  render();
})();
</script>
</body>
</html>
